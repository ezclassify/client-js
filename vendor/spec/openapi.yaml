          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/describe-concept:
    get:
      operationId: ctxSchemeDescribeConcept
      summary: Describe a concept in a context
      description: >-
        Returns structured description and metadata for the specified concept within a category, scoped to the context's
        composed scheme. The :version segment may be omitted to default to "latest".
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
        - name: conceptId
          in: query
          required: true
          description: Concept identifier to describe.
          schema:
            type: string
        - name: categoryId
          in: query
          required: true
          description: Category identifier the concept belongs to.
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: "The view to name the concept in: a key of the concept's `views`. Omitted, its default view."
          schema:
            type: string
      responses:
        "200":
          description: Concept description
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSchemeConceptDescriptionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            The context is not found, or the concept or category is not one its scheme declares. An unknown concept or
            category carries `code: NOT_FOUND` and a `detail` naming the query parameter and the id; a request refused
            before routing carries the constant codeless refusal body, so a caller can tell an unknown concept from a
            context it may not reach.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/access/check:
    post:
      operationId: ctxAccessCheck
      summary: Check access decision in a context
      description: >-
        Evaluates the context's access policy against a TARGET (a `marking` string or its structured `assertions` form,
        merged when both are given) and the SUBJECT (`userAttributes`), with optional comparison `context`. When
        decision audit is enabled, configured JSON Pointer paths select required user and resource identifiers from
        `context`. The :version segment may be omitted to default to "latest".
      tags:
        - context
        - access
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtxAccessCheckRequestBody"
            example:
              marking: LEVEL-HIGH
              userAttributes:
                clearance: high
              context:
                audit:
                  userId: user-123
                  resourceId: record-12345
      responses:
        "200":
          description: Resolved Context access decision
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextAccessDecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
          description: Context has no access policy attached.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/access/describe-rule:
