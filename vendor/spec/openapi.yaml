          description: Guide id when the context has multiple guides. Defaults to the first guide.
      required:
        - query
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/guide/filter-rules
    CtxGuideScanRequestBody:
      type: object
      properties:
        text:
          type: string
          description: Text to scan against the context's guides.
        guideId:
          type: string
          description: Optional guide id to scope scanning to a single guide.
      required:
        - text
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/guide/scan
    CtxGuideViewRequestBody:
      type: object
      properties:
        guideId:
          type: string
          description: Guide id when the context has multiple guides. Defaults to the first guide.
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/guide/view
    CtxListResponseBody:
      type: object
      properties:
        contexts:
          type: array
          items:
            type: string
          description: Context ids the caller may use, sorted alphabetically.
      required:
        - contexts
      description: "Response body for GET /v1/ctx: the context ids this caller may use."
    CtxSchemeAggregateRequestBody:
      type: object
      properties:
        inputs:
          type: array
          items:
            type: string
          description: "Array of marking strings to aggregate. Mutually exclusive with `assertionSets`: supply exactly one."
        assertionSets:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Assertion"
          description: >-
            Already-parsed assertion sets to aggregate, one inner array per marking. Skips the string-parse stage; the
            rest of the aggregate pipeline runs identically to `inputs`. Transports marking state losslessly (scope-only
            assertions and capture values survive). Mutually exclusive with `inputs`.
        inputFormat:
          type: string
          description: >-
            The format the strings in `inputs` are written in. For a scheme that declares `render.surfaces`, the view
            they are read as, or one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or
            empty, recognition works it out. Refused with `assertionSets`, which carries no text to read.
        outputFormat:
          type: string
          description: >-
            The format the combined marking is rendered in. Omitted or empty, the scheme's default format. It selects
            output only. For a scheme that declares `render.surfaces`, an output as the scheme document's
            `render.surfaces` defines it.
        context:
          $ref: "#/components/schemas/ProcessingContext"
          description: Optional ProcessingContext forwarded verbatim to the engine.
        surface:
          type: string
          description: >-
            Validation surface of the rollup, using the scheme's scope ids. Names what the combined marking is, not what
            any one contributor was. Omitted, the rollup is a whole marking and every required category belonging to the
            marking as a whole must be covered by the combined result, which is the whole-document case: a portion that
            omits one is not faulted for it. Given a scope id, the inputs are fragments of that one surface and only the
            required categories that surface owns are demanded of the rollup.
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/aggregate
    CtxSchemeCheckCoverageRequestBody:
      type: object
      properties:
        children:
          type: array
          items:
            type: string
          description: Child marking strings that must be covered by the parent.
        parent:
          type: string
          description: >-
            Parent marking string checked against the children's rollup. It covers them when it lacks nothing the rollup
            needs and carries nothing the rollup does not account for.
        inputFormat:
          type: string
          description: >-
            The format `children` and `parent` are written in. For a scheme that declares `render.surfaces`, the view
            they are read as, or one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or
            empty, recognition works it out.
        outputFormat:
          type: string
          description: >-
            The format `rendered` is written in. Omitted or empty, the scheme's default format. For a scheme that
            declares `render.surfaces`, an output as the scheme document's `render.surfaces` defines it.
      required:
        - children
        - parent
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/check-coverage
    CtxSchemeDiffRequestBody:
      type: object
      properties:
        a:
          type: string
          description: First marking string.
        b:
          type: string
          description: Second marking string.
        inputFormat:
          type: string
          description: >-
            The format `a` and `b` are written in. For a scheme that declares `render.surfaces`, the view they are read
            as, or one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or empty,
            recognition works it out.


            There is no output format: the response is three assertion arrays and no string, so nothing here renders.
      required:
        - a
        - b
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/diff
    CtxSchemeExplainRequestBody:
      type: object
      properties:
        input:
          type: string
          description: The marking text, as typed.
        inputFormat:
          type: string
          description: >-
            The format `input` is written in. For a scheme that declares `render.surfaces`, the view it is read as, or
            one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or empty, recognition
            works it out.
        outputFormat:
          type: string
          description: >-
            The output the trace's `rendered` is written in. For a scheme that declares `render.surfaces`, an output as
            the scheme document's `render.surfaces` defines it. Omitted or empty, the scheme's default format, or with
            `render.surfaces`, each written surface's default for the marking's role, by the rule `render.surfaces`
            states for a request that names no output.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: The facts already chosen, settled together with what `input` states as one marking.
        context:
          $ref: "#/components/schemas/ProcessingContext"
          description: Optional ProcessingContext forwarded verbatim to the engine.
        surface:
          type: string
          description: >-
            Validation surface: names which surface of a marking `input` is, using the scheme's scope ids. Omitted, the
            input is a whole marking.
        parts:
          type: array
          items:
            type: string
          description: Part markings the whole must cover. The whole is judged as covering them, as on the process request.
      required:
        - input
      additionalProperties: false
      description: |-
        POST /v1/ctx/{ctxId}/{version?}/scheme/explain: the trace of a process call.

        Takes what process takes, apart from `outputs` and `suggestFor`, which only add to a process result.
    CtxSchemeFilterConceptsRequestBody:
      type: object
      properties:
        query:
          type: string
          description: Text query to filter the concept list.
      required:
        - query
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/filter-concepts
    CtxSchemeNormalizeRequestBody:
      type: object
      properties:
        input:
          type: string
          description: Marking string to normalize.
        inputFormat:
          type: string
          description: >-
            The format `input` is written in. For a scheme that declares `render.surfaces`, the view it is read as, or
            one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or empty, recognition
            works it out and reports what the text was read as on `recognition.inputFormat`.
        outputFormat:
          type: string
          description: >-
            The format the result is rendered in. Omitted or empty, the scheme's default format. It selects output only:
            it never narrows what may be read.


            For a scheme that declares `render.surfaces`, an output as the scheme document's `render.surfaces` defines
            it.
      required:
        - input
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/normalize
    CtxSchemeNoticesRequestBody:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: Assertions from a prior process() call whose concept notices should be collected.
      required:
        - assertions
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/notices
    CtxSchemeProcessRequestBody:
      type: object
      properties:
        input:
          type: string
          description: The marking text, as typed.
        inputFormat:
          type: string
          description: >-
            The format `input` is written in. For a scheme that declares `render.surfaces`, the view it is read as, or
            one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or empty, recognition
            works it out and reports what the text was read as on `recognition.inputFormat`.
        outputFormat:
          type: string
          description: >-
            The output the result is rendered in. It selects output only: it never narrows what may be read. For a
            scheme that declares `render.surfaces`, an output as the scheme document's `render.surfaces` defines it.


            Omitted or empty, the scheme's default format, or with `render.surfaces`, each written surface's default for
            the marking's role, by the rule `render.surfaces` states for a request that names no output.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: The facts already chosen, settled together with what `input` states as one marking.
        context:
          $ref: "#/components/schemas/ProcessingContext"
          description: Optional ProcessingContext forwarded verbatim to the engine.
        surface:
          type: string
          description: >-
            Validation surface: names which surface of a marking `input` is, using the scheme's scope ids. Omitted, the
            input is a whole marking and every required category belonging to the marking as a whole must be covered.
            Given a scope id, the input is that surface's fragment and only the required categories that surface owns
            are demanded.
        parts:
          type: array
          items:
            type: string
          description: >-
            Part markings the whole must cover. The whole is judged as covering them: a part it does not cover is an
            error, and so is a part that does not read as a marking. Every rank floor is worked out against the whole
            and these parts together, so a raise never lands below what a part needs, and every proposed fix is proven
            with them, as `ProcessResult.proposedFixes` states. Each entry is a marking in one of the scheme's part
            formats, or any format the scheme reads. Empty or absent, the whole stands alone.
        outputs:
          type: array
          items:
            type: string
          description: >-
            The outputs to write into `renders`, each an output address spelled exactly as a key of `renders` is:
            `surface/view` for a scheme that declares `render.surfaces`, a format id otherwise. Omitted or empty,
            `renders` is empty. An address the scheme does not declare is refused.
        suggestFor:
          type: array
          items:
            type: string
          description: >-
            Category ids to answer picker options for, against the settled facts, in `suggestionsFor`. Omitted, nothing
            is suggested and the field is absent from the result. An id the scheme does not declare is refused.
      required:
        - input
      additionalProperties: false
      description: >-
        POST /v1/ctx/{ctxId}/{version?}/scheme/process: the author's call.


        `input` is what was typed and `assertions` the facts already chosen, and a composer sends both on each
        keystroke. The two are settled together as one marking, so a conflict between them is the scheme's to repair or
        report, as it would be within one input. Either may be empty: an empty `input` with `assertions` processes the
        chosen facts alone.
    CtxSchemeRenderRequestBody:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: Assertions to render into a marking string.
        outputFormat:
          type: string
          description: >-
            The format the assertions are rendered in. Omitted or empty, the scheme's default format. For a scheme that
            declares `render.surfaces`, an output as the scheme document's `render.surfaces` defines it.
        preservation:
          $ref: "#/components/schemas/RenderPreservation"
          description: >-
            What this render is being asked for. `projection` (default) renders what the format writes and reports the
            rest on `assessment`. `full` fails rather than answering when facts were omitted, conflicting, or
            unrepresentable, so a caller transporting state cannot receive a plausible string instead.
      required:
        - assertions
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/render
    CtxSchemeScanRequestBody:
      type: object
      properties:
        text:
          type: string
          description: Text to scan for embedded markings.
        inputFormat:
          type: string
          description: >-
            The format the markings in `text` are written in. For a scheme that declares `render.surfaces`, the view
            they are read as, or one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or
            empty, recognition works it out.
        outputFormat:
          type: string
          description: >-
            The output each found marking is rendered back in. For a scheme that declares `render.surfaces`, an output
            as the scheme document's `render.surfaces` defines it. Omitted or empty, each marking is written as
            `ScanResult.type` describes.
      required:
        - text
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/scan
    CtxSchemeSuggestForCategoriesRequestBody:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            The caller's full committed assertion set. Each category is answered as if its own assertions were not
            present.
        categoryIds:
          type: array
          items:
            type: string
          description: Category ids to produce suggestions for.
        outputFormat:
          type: string
          description: >-
            The format suggestion previews are rendered in. For a scheme that declares `render.surfaces`, an output as
            the scheme document's `render.surfaces` defines it. An empty one is the same as none.


            There is no input format: this takes a committed assertion set, never text.
        surface:
          type: string
          description: >-
            Suggestion surface, by scheme scope id: restricts suggestions to the concepts and categories that surface
            owns.
      required:
        - assertions
        - categoryIds
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/suggest-for-categories
    CtxSchemeSuggestRequestBody:
      type: object
      properties:
        input:
          type: string
          description: The marking as text, which may be empty to ask for every option. Provide this or `assertions`, never both.
        inputFormat:
          type: string
          description: >-
            The format `input` is written in, when it is a marking string. For a scheme that declares `render.surfaces`,
            the view it is read as, or one of its forms, as the scheme document's `render.surfaces` defines them.
            Omitted or empty, recognition works it out. Refused with `assertions`, which carries no text to read.
        outputFormat:
          type: string
          description: >-
            The format suggestion previews are rendered in. For a scheme that declares `render.surfaces`, an output as
            the scheme document's `render.surfaces` defines it. An empty one is the same as none.
        filter:
          type: string
          description: Filter string to narrow suggestions.
        surface:
          type: string
          description: >-
            Suggestion surface, by scheme scope id: restricts suggestions to the concepts and categories that surface
            owns.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: The marking as facts already chosen. Provide this or `input`, never both.
        includeGated:
          type: boolean
          description: >-
            Include concepts the active filter would otherwise hide because their prerequisites are unmet. Each comes
            back with `gated: true` and the `requires` ids that would unlock it.
      additionalProperties: false
      description: >-
        POST /v1/ctx/{ctxId}/{version?}/scheme/suggest: the options a picker may offer.


        The marking arrives as text in `input` or as facts in `assertions`, exactly one of the two; neither or both is a
        400. Presence decides, as on validate: an empty `input` is text with nothing typed yet, and an empty
        `assertions` is facts with none chosen. Text typed beside facts already chosen is what process answers, with
        `suggestFor`.
    CtxSchemeValidateRequestBody:
      type: object
      properties:
        input:
          type: string
          description: The marking as text. Provide this or `assertions`, never both.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            The marking as facts as stated: what a document or an author states, before any engine settled them. Never
            the `assertions` of an earlier result, which are settled already and can read valid where the text they came
            from did not. Provide this or `input`, never both.
        inputFormat:
          type: string
          description: >-
            The format `input` is written in. For a scheme that declares `render.surfaces`, the view it is read as, or
            one of its forms, as the scheme document's `render.surfaces` defines them. Omitted or empty, recognition
            works it out and reports what the text was read as on `recognition.inputFormat`. Refused with `assertions`,
            which carries no text to read.
        outputFormat:
          type: string
          description: >-
            The output the result is rendered in. It selects output only: it never narrows what may be read. For a
            scheme that declares `render.surfaces`, an output as the scheme document's `render.surfaces` defines it.


            Omitted or empty, the scheme's default format, or with `render.surfaces`, each written surface's default for
            the marking's role, by the rule `render.surfaces` states for a request that names no output.
        context:
          $ref: "#/components/schemas/ProcessingContext"
          description: Optional ProcessingContext forwarded verbatim to the engine.
        surface:
          type: string
          description: >-
            Validation surface: names which surface of a marking the input is, using the scheme's scope ids. Omitted,
            the input is a whole marking and every required category belonging to the marking as a whole must be
            covered. Given a scope id, the input is that surface's fragment and only the required categories that
            surface owns are demanded.
        parts:
          type: array
          items:
            type: string
          description: >-
            Part markings the whole must cover. The whole is judged as covering them: a part it does not cover is an
            error, and so is a part that does not read as a marking. Each entry is a marking in one of the scheme's part
            formats, or any format the scheme reads. Empty or absent, the whole stands alone.
      additionalProperties: false
      description: >-
        POST /v1/ctx/{ctxId}/{version?}/scheme/validate: the reader's call.


        The marking arrives as text in `input` or as facts in `assertions`, exactly one of the two; neither or both is a
        400. They are two fields because the MCP catalog builder refuses a field that is a string or an array, and the
        rule is stated here rather than as a root `oneOf`, which would make every generated SDK model this request as a
        union of two request types.


        Nothing here changes how the engine settles the marking, so `valid` and `inputWasValid` mean what they mean on
        every other route. `surface`, `context` and `parts` say what the marking is judged as, as on process.
    CtxSchemeViewRequestBody:
      type: object
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/scheme/view
    CtxVersionsResponseBody:
      type: object
      properties:
        id:
          type: string
          description: Echoed context id.
        versions:
          type: array
          items:
            type: string
          description: Every installed version the caller may use, sorted highest-first.
      required:
        - id
        - versions
      description: "Response body for GET /v1/ctx/{ctxId}: versions for a given context id."
    DecisionProposalOrigin:
      type: string
      enum:
