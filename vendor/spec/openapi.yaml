        - conceptId
      description: One target assertion a crosswalk can emit or propose.
    CrosswalkTranslationResult:
      anyOf:
        - $ref: "#/components/schemas/CrosswalkCompletedTranslationResult"
        - $ref: "#/components/schemas/CrosswalkForbiddenTranslationResult"
      description: Result of applying a reviewed directional crosswalk.
    CtxAccessCheckRequestBody:
      type: object
      properties:
        marking:
          type: string
          description: >-
            TARGET marking string to check access against. Parsed to data assertions before evaluation. Provide this OR
            `assertions` (the structured alternative); both feed the same first argument of the access check.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            TARGET as structured assertions: the alternative to the `marking` string for callers that already hold
            parsed assertions. Merged with any assertions derived from `marking`. This is the single structured target
            field.
        userAttributes:
          type: object
          additionalProperties: {}
          description: >-
            User/principal attributes evaluated by the access policy. Attribute paths and value interpretation are
            defined by that access policy. This is the only user-attribute input.
        context:
          type: object
          additionalProperties: {}
          description: Optional contextual attributes for access evaluation (third check argument).
      required:
        - userAttributes
      additionalProperties: false
      description: >-
        POST /v1/ctx/{ctxId}/{version?}/access/check. Three inputs, matching the engine's
        `AccessEngine.check(dataAssertions, userAttributes, context)` contract. First, the TARGET being access-checked:
        either a rendered `marking` string or its structured `assertions` array form (a marking string is parsed to
        assertions first). Provide either or both; when both are present the assertions derived from `marking` are
        merged with the `assertions` array. Second, the SUBJECT: `userAttributes`, always an object of the user's
        attributes. Third, `context`: extra comparison data (e.g. distribution orgs) not encoded in the marking. When
        decision audit is enabled, deployment configuration identifies required user and resource ids inside `context`.
    CtxAccessDescribeRequirementsRequestBody:
      type: object
      properties:
        marking:
          type: string
          description: Marking parsed through the Context's bound scheme.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: Structured target assertions merged with any parsed marking.
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/access/describe-requirements
    CtxAccessDescribeRuleRequestBody:
      type: object
      properties:
        ruleId:
          type: string
          description: Access rule id from the loaded access policy.
      required:
        - ruleId
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/access/describe-rule
    CtxAccessRulesResponseBody:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AccessRuleDescription"
          description: Descriptions for every rule in the access policy, in declared order.
      required:
        - rules
      description: >-
        Response body for GET /v1/ctx/{ctxId}/{version?}/access/rules: every rule in the context's access policy.


        One route serves both halves of the adapter contract. A caller that wants the descriptions has them; a caller
        that only wants the rule ids reads them off the same response instead of spending a second round trip on a
        projection of what it already holds.
    CtxComponentDescriptor:
      type: object
      properties:
        id:
          type: string
          description: Component id from the context declaration.
        version:
          type: string
          description: Requested version literal (concrete semver or 'latest').
        resolvedVersion:
          type: string
          description: Concrete version after `latest` resolution.
        layers:
          type: array
          items:
            $ref: "#/components/schemas/CtxComponentDescriptor"
          description: Layers nested beneath this component, in composition order.
      required:
        - id
        - version
        - resolvedVersion
      description: Component reference echoed in a `CtxDescribeResponseBody`.
    CtxCrosswalkTranslateRequestBody:
      type: object
      properties:
        crosswalkId:
          type: string
          description: Crosswalk artifact id declared by the context.
        marking:
          type: string
          description: >-
            SOURCE marking text, parsed against the crosswalk's source scheme before translation. Provide this OR
            `assertions`, never both.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            SOURCE as structured assertions, for callers that already hold the parsed form. Provide this OR `marking`,
            never both.
      required:
        - crosswalkId
      additionalProperties: false
      description: >-
        POST /v1/ctx/{ctxId}/{version?}/crosswalk/translate. The adapter takes the SOURCE as one field holding either a
        marking string or its parsed assertions; the wire splits that into the same two fields
        `CtxAccessCheckRequestBody` uses for its target, because a field that is a string or an array is a shape the MCP
        catalog builder refuses to describe as a tool input. Exactly one of `marking` and `assertions` is required:
        neither is a request with no source, both is two sources with no rule for which one the crosswalk reads, and
        either is a 400.
    CtxDescribeResponseBody:
      type: object
      properties:
        id:
          type: string
          description: Context id.
        version:
          type: string
          description: Concrete context version after `latest` resolution.
        description:
          type: string
          description: Optional human-readable description copied from the declaration.
        scheme:
          $ref: "#/components/schemas/CtxComponentDescriptor"
          description: The composed scheme (base of the layer stack).
        schemes:
          type: array
          items:
            $ref: "#/components/schemas/ContextSchemeDescriptor"
          description: >-
            Every scheme this Context holds, primary first, each with the selector that addresses it.


            The scheme sub-resources under this Context take `?scheme={selector}`, and this is where the valid values
            come from. `scheme` above answers a different question: it names the component the Context resolved and the
            layers stacked on it, which is provenance rather than a selector.
        guides:
          type: array
          items:
            $ref: "#/components/schemas/CtxComponentDescriptor"
          description: Guide components in precedence order, or omitted when none.
        access:
          $ref: "#/components/schemas/CtxComponentDescriptor"
          description: Access policy component, or omitted when the context defines no access doc.
        crosswalks:
          type: array
          items:
            $ref: "#/components/schemas/CtxComponentDescriptor"
          description: >-
            Crosswalk components in declaration order, or omitted when the context declares none. A crosswalk the
            context follows at `latest` reports here the concrete version that answered.
      required:
        - id
        - version
        - scheme
        - schemes
      description: "Response body for GET /v1/ctx/{ctxId}/{version}: decomposed context."
    CtxDocumentAssessAccessRequestBody:
      type: object
      properties:
        text:
          type: string
          description: Full document text to audit before access is assessed.
        userAttributes:
          type: object
          additionalProperties: {}
          description: User attributes interpreted by the Context's access policy.
        context:
          type: object
          additionalProperties: {}
          description: Optional relationship attributes used with the user attributes.
        guideDeterminations:
          $ref: "#/components/schemas/GuideDeterminationInput"
          description: Optional analyst decisions applied to nominations for this document.
        responseProfile:
          $ref: "#/components/schemas/DocumentResponseProfile"
          description: Detail projection applied after all access scenarios are evaluated.
      required:
        - text
        - userAttributes
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/document/assess-access
    CtxDocumentAuditRequestBody:
      type: object
      properties:
        text:
          type: string
          description: Full document text to scan for markings.
        guideDeterminations:
          $ref: "#/components/schemas/GuideDeterminationInput"
          description: Optional analyst decisions applied to nominations for this document.
        responseProfile:
          $ref: "#/components/schemas/DocumentResponseProfile"
          description: Detail projection applied after the complete audit is evaluated.
      required:
        - text
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/document/audit
    CtxGuideDescribeRuleRequestBody:
      type: object
      properties:
        ruleId:
          type: string
          description: Rule id to describe.
        guideId:
          type: string
          description: Guide id when the context has multiple guides. Defaults to the first guide.
      required:
        - ruleId
      additionalProperties: false
      description: POST /v1/ctx/{ctxId}/{version?}/guide/describe-rule
    CtxGuideEvaluateRequestBody:
      type: object
      properties:
        guideId:
          type: string
          description: "ID of one guide within the context. Supply this or `allGuides: true`."
        allGuides:
          type: boolean
          description: Evaluate and combine every loaded guide through the context's scheme.
        selectedRuleIds:
          type: array
          items:
            type: string
          description: Rule IDs the user selected (checked) in the guide wizard.
      required:
