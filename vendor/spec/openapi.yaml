      type: object
      properties:
        categoryId:
          type: string
          description: Category containing the asserted concept.
        conceptId:
          type: string
          description: Asserted concept identifier.
        value:
          type: string
          description: Captured value for value-bearing concepts.
        copyValue:
          type: boolean
          description: Copy the source assertion's captured value onto this target.
      required:
