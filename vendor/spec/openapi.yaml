            phone, ssn, credit_card, date, uuid) or 'regex' for custom. Domain-specific packs (usgov, healthcare,
            financial, ...) add further names when registered.
          minLength: 1
        pattern:
          type: string
          description: "Custom regex pattern: only used when type is 'regex'."
        label:
          type: string
          description: "Display label: overrides the matcher's built-in label."
        caseSensitive:
          type: boolean
          description: >-
            Case-sensitivity for a `type: 'regex'` leaf. When true the pattern compiles without the `i` flag, so an
            `[A-Z]` class means uppercase only. Absent or false, the pattern matches case-insensitively. Ignored on
            non-`regex` leaves.
        runtime:
          type: boolean
          description: >-
            `runtime: true` marks a matcher provided by the host at runtime. Such a leaf is always valid at load; if the
            named matcher is not registered it matches nothing here, and resolves normally where it is registered.
      required:
        - type
      description: >-
        A named pattern matcher specification. Use built-in types like 'ipv4', 'email', 'coordinates', or 'regex' with a
        custom pattern.
    GuideNomination:
      type: object
      properties:
        findingId:
          type: string
          description: Deterministic identity of this evidence occurrence.
        documentDigest:
          type: string
          description: Digest of the exact scanned document bytes.
        origin:
          type: string
          const: lexical
          description: >-
            Nomination source; lexical evidence is never authoritative itself.


            Always `lexical`, and fixed for this major version. A nomination is by definition a rule's evidence matched
            in the document text, and the counts, determinations and advisory results that refer to nominations all mean
            lexical ones. A proposal from any other source (an analyst, an agent, a host) reaches the analyst as a
            manual selection with its own `proposalOrigin`. A new nomination source would change what this list means,
            so it would arrive as a new field, not as a new value here.
        rule:
          $ref: "#/components/schemas/RuleReference"
          description: Qualified rule nominated by the evidence.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContentEvidenceSpan"
          description: Evidence occurrences supporting the nomination.
        proposedAssertions:
          type: array
          items:
            $ref: "#/components/schemas/AssertionReference"
          description: Assertions the rule would propose if accepted.
        rationale:
          type: string
          description: Rule-authored explanation for the nomination.
      required:
        - findingId
        - documentDigest
        - origin
        - rule
        - evidence
        - proposedAssertions
      description: Evidence-preserving lexical nomination requiring analyst review.
    GuideRule:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier within the guide.
        name:
          type: string
          description: Human-readable display name.
        description:
          type: string
          description: Description of the data element this rule covers.
        keywords:
          type: array
          items:
            type: string
          description: Searchable terms for literal keyword filtering (absent on computed rules).
        match:
          type: array
          items:
            $ref: "#/components/schemas/MatchNode"
          description: >-
            Named pattern matchers for content evaluation. Each entry is a `MatchNode`: a leaf spec referencing a
            built-in matcher (e.g. `{ type: 'ipv4' }`) or a custom regex (`{ type: 'regex', pattern: '...' }`), or a
            combinator node (`any` / `all` / `not` / `near` / `context` / `validate`) composed over child nodes. When
            content is evaluated, both `keywords` and `match` are checked.
        category:
          type: string
          description: Guide category ID for grouping in the UI.
        outcome:
          $ref: "#/components/schemas/GuideRuleOutcome"
          description: What this rule contributes when active. At least one of rendered or concepts must be set.
        rationale:
          type: string
          description: Explanation of why this outcome applies.
        when:
          $ref: "#/components/schemas/RuleWhen"
          description: >-
            When present, this rule auto-activates based on other rules' selection state. Uses the same when framework
            as scheme rules. `has` references guide rule IDs. Rules with `when` are "computed"; they don't appear as
            checkboxes.
        overrides:
          type: array
          items:
            type: string
          description: >-
            Rule IDs whose outcomes this rule replaces when active. When omitted (default), this rule's outcome is
            additive: it contributes alongside the rules it depends on.
      required:
        - id
        - name
        - outcome
      description: >-
        A rule in a marking guide: a data-element description with an outcome that contributes to the aggregate marking
        when activated.


        Rules are presented as checkboxes in the UI. `keywords` enables keyword-search filtering; `match` enables
        text-scan detection (e.g., finding IPv4 addresses in a document body). `outcome.rendered` or `outcome.concepts`
        provides the marking contribution. Rules with `when` are computed; they auto-activate based on sibling rule
        selection state and do not appear as user-visible checkboxes.


        This is the named runtime/read-result shape. Authoring input is carried by the guide definition's `rules.inline`
        entries.
    GuideRuleOutcome:
      type: object
      properties:
        rendered:
          type: string
          description: "Pre-rendered marking string: parsed by engine.process() during evaluation."
        concepts:
          type: array
          items:
            $ref: "#/components/schemas/ConceptRef"
          description: "Direct concept references: converted to assertions, then engine.process()'d."
      description: "The effect of a guide rule: what it contributes to the marking."
    GuideRuleView:
      type: object
      properties:
        id:
          type: string
          description: The rule id.
        name:
          type: string
          description: The rule's display name.
        description:
          type: string
          description: The rule's description, when it declares one.
        outcomeText:
          type: string
          description: >-
            The rule's outcome for display: its rendered marking, or its concept ids listed in order when it has none.
            Empty when the outcome carries neither.
        whenText:
          type: string
          description: The rule's `when` condition in words. Set only on a computed rule.
        isComputed:
          type: boolean
          description: True when the rule has a `when` condition and is activated by it.
        keywords:
          type: array
          items:
            type: string
          description: The keywords a text scan matches for this rule.
        matcherLabels:
          type: array
          items:
            type: string
          description: Labels like "IPv4 address", "CIDR block", already resolved via getMatcher.
        dependsOn:
          type: array
          items:
            type: string
          description: Rule ids this compound rule references.
        dependsOnNames:
          type: array
          items:
            type: string
          description: >-
            Resolved display names for each id in `dependsOn`, index-aligned, so a "depends on" line reads the rule's
            name rather than its raw id. `dependsOn` stays as the machine keys.
        overrides:
          type: array
          items:
            type: string
          description: Rule ids this compound rule overrides when it fires.
        overrideNames:
          type: array
          items:
            type: string
          description: >-
            Resolved display names for each id in `overrides`, index-aligned, so the Guidebook "Overrides:" line reads
            rule names rather than raw ids, matching the sibling "When:" line which already resolves display.
            `overrides` stays as the machine keys.
        rationale:
          type: string
          description: Optional rationale text from the rule definition.
      required:
        - id
        - name
        - outcomeText
        - isComputed
        - keywords
        - matcherLabels
        - dependsOn
        - dependsOnNames
        - overrides
        - overrideNames
      description: Item row rendered by the Guidebook / GuideChecklist (one per rule in a guide).
    GuideScanResult:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/GuideRule"
          description: The guide rule that matched.
        guideId:
          type: string
          description: The id of the guide the rule belongs to, when the scan covered more than one.
        matchedKeywords:
          type: array
          items:
            type: string
          description: Each keyword or matcher label that fired, once each.
        spans:
          type: array
          items:
            $ref: "#/components/schemas/GuideScanSpan"
          description: Every place in the text where the rule fired, in the order found.
        provenance:
          $ref: "#/components/schemas/SourceReference"
          description: >-
            Source provenance for the guide-rule source that supplied the matched rule.


            Populated only when the rule came from an external `GuideRuleSource` override wired into the `GuideEngine`
            at load time (typically a `MappedGuideRuleSource` the server's Context loader built from a guide YAML's
            `rules.external` block). Inline-backed results leave this field undefined to keep payloads compact for the
            common single-source case.


            Identity fields mirror the source's `sourceIdentity()` observation at engine-construction time.
      required:
        - rule
        - matchedKeywords
        - spans
      description: >-
        A guide rule matched by text scanning, with every span where the rule's keywords or matchers fired. Returned by
        the engine's `scanGuides` and the standalone `scanTextForRules` / `scanMultipleGuides` helpers.


        Parallels the scheme-side scan result: one entry per rule hit, with offsets into the scanned text.
    GuideScanSpan:
      type: object
      properties:
        keyword:
          type: string
          description: The keyword that matched, or the label of the matcher that did.
        start:
          type: integer
          description: Offset in the scanned text where the match starts, in UTF-16 code units.
        end:
          type: integer
          description: Offset in the scanned text just past the end of the match, in UTF-16 code units.
        confidence:
          type: number
          description: >-
            Advisory confidence in [0, 1], present only when the scan asked for it with the `confidence` scan option. An
            ordinal hint derived from the match's shape, not a calibrated probability.
      required:
        - keyword
        - start
        - end
      description: A span, by offsets into the scanned text, where a guide rule keyword or pattern matched.
    GuideScopeCoverage:
      type: object
      properties:
        scopeId:
          type: string
          description: Unit scope identifier.
        determinedCoverage:
          anyOf:
            - $ref: "#/components/schemas/CheckCoverageResult"
            - type: "null"
          description: Coverage against currently accepted/manual facts.
        projectedCoverage:
          anyOf:
            - $ref: "#/components/schemas/CheckCoverageResult"
            - type: "null"
          description: Advisory coverage assuming unresolved nominations are accepted.
      required:
        - scopeId
        - determinedCoverage
        - projectedCoverage
      description: Coverage of one unit against determined and projected requirements.
    GuideUnitEvaluation:
      type: object
      properties:
        scopeId:
          type: string
          description: Opaque stable scope identifier.
        start:
          type: integer
          description: Zero-based inclusive UTF-8 byte offset.
        end:
          type: integer
          description: Zero-based exclusive UTF-8 byte offset.
        offsetEncoding:
          type: string
          const: utf-8-bytes
          description: Frozen byte-offset encoding.
        findingIds:
          type: array
          items:
            type: string
          description: Nomination IDs whose evidence belongs to this unit.
        determined:
          anyOf:
            - $ref: "#/components/schemas/GuideCompiledResult"
            - type: "null"
          description: Compilation over accepted findings and manual selections.
        projected:
          anyOf:
            - $ref: "#/components/schemas/GuideCompiledResult"
            - type: "null"
          description: Advisory compilation additionally assuming unresolved nominations.
      required:
        - determined
        - end
        - findingIds
        - offsetEncoding
        - projected
        - scopeId
        - start
      description: Determined and projected compilation for one document unit.
    GuideViewResponse:
      type: object
      properties:
        id:
          type: string
          description: The guide id.
        name:
          type: string
          description: The guide's display name.
        description:
          type: string
          description: The guide's description. Empty when the guide declares none.
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The category id, or `_compound` for the compound rules.
              label:
                type: string
                description: The category's display label.
              items:
                type: array
                items:
                  $ref: "#/components/schemas/GuideRuleView"
                description: The category's rules, in declared order.
            required:
              - id
              - label
              - items
          description: >-
            The guide's categories in declared order, each with its checkable rules, followed by the `_compound`
            category that holds every rule with a `when` condition. A category with no rules is left out.
        uncategorized:
          type: array
          items:
            $ref: "#/components/schemas/GuideRuleView"
          description: Checkable rules that name no category, or a category the guide does not declare.
        vocabulary:
          $ref: "#/components/schemas/Vocabulary"
          description: Display-term overrides the guide declares, unresolved.
      required:
        - id
        - name
        - description
        - categories
        - uncategorized
      description: >-
        Render-ready Guidebook tree for a guide: its rules grouped under the guide's categories, with every compound
        rule in one `_compound` category at the end.
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          const: ok
          description: Always `"ok"` while the server is running.
        engineVersion:
          type: string
          description: Engine package version exposed to clients.
        engineSha:
          type: string
          description: Git commit SHA of the deployed build (from GIT_SHA env var, or empty string).
        gitTag:
          type: string
          description: Git tag of the deployed build (from GIT_TAG env var, or empty string).
        openapiVersion:
          type: string
          description: OpenAPI spec version from info.version in openapi.yaml. SDKs compare this against their vendored spec.
        abiVersion:
          type: string
          const: v1
          description: >-
            Version of the wire interface this server speaks, fixed at `v1`. A client can compare it against the version
            it was built for before making calls.
      required:
        - status
        - engineVersion
        - engineSha
        - gitTag
        - openapiVersion
        - abiVersion
      description: Response body for GET /v1/health
    InputSpan:
      type: object
      properties:
        start:
          type: integer
          description: Start offset in the input string.
        end:
          type: integer
          description: End offset in the input string.
        text:
          type: string
          description: The text at that span.
      required:
        - start
        - end
        - text
      description: One span of the input, by offset and text.
    LabelPresetView:
      type: object
      properties:
        id:
          type: string
          description: Preset id, which `applyPreset` takes.
        label:
          type: string
          description: Display label for the preset.
        description:
          type: string
          description: Longer explanation of when to use the preset.
        scope:
          type: string
          description: Id of the scope the preset belongs to. A preset without one belongs to the scheme's `defaultScope`.
      required:
        - id
        - label
      description: >-
        A named shortcut marking, name only: the marking it stands for stays server-side and is expanded by
        `applyPreset`.
    ManualGuideSelection:
      type: object
      properties:
        documentDigest:
          type: string
          description: Digest of the exact document revision reviewed.
        rule:
          $ref: "#/components/schemas/RuleReference"
          description: Qualified loaded rule selected by the analyst.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContentEvidenceSpan"
          description: Evidence in the submitted document supporting the selection.
        reason:
          type: string
          description: Analyst-supplied reason for the selection.
        proposalOrigin:
          $ref: "#/components/schemas/DecisionProposalOrigin"
          description: Optional provenance for how the selection proposal was drafted.
        selectionId:
          type: string
          description: Deterministic selection identity.
      required:
        - documentDigest
        - evidence
        - reason
        - rule
        - selectionId
      description: Validated manual guide fact bound to a document revision.
    ManualGuideSelectionInput:
      type: object
      properties:
        documentDigest:
          type: string
          description: Digest of the exact document revision reviewed.
        rule:
          $ref: "#/components/schemas/RuleReference"
          description: Qualified loaded rule selected by the analyst.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContentEvidenceSpan"
          description: Evidence in the submitted document supporting the selection.
        reason:
          type: string
          description: Analyst-supplied reason for the selection.
        proposalOrigin:
          $ref: "#/components/schemas/DecisionProposalOrigin"
          description: Optional provenance for how the selection proposal was drafted.
      required:
        - documentDigest
        - rule
        - evidence
        - reason
      additionalProperties: false
      description: Input for an analyst-selected rule that lexical scanning missed.
    MarkingColorRule:
      type: object
      properties:
        when:
          $ref: "#/components/schemas/RuleWhen"
          description: >-
            Assertion-set condition. Omit only on the final rule to create the standard unconditional/anything-else
            fallback.
        color:
          $ref: "#/components/schemas/ConceptColor"
          description: Complete background/text pair to use when the condition matches.
      required:
        - color
      description: Ordered scheme-default or host display-color override.
    MarkingValidation:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            The facts the marking states, settled and listed in print order as a validate result's `assertions` are, in
            the role the marking has in this document.
        recognition:
          $ref: "#/components/schemas/RecognitionResult"
          description: What recognition made of the marking, as `ValidateResult.recognition`.
        valid:
          type: boolean
          description: Whether the marking stands once settled, as `ValidateResult.valid`.
        inputWasValid:
          type: boolean
          description: Whether the marking needed no change as written, as `ValidateResult.inputWasValid`.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
          description: What the scheme's rules find wrong with the settled marking.
        proposedFixes:
          type: array
          items:
            $ref: "#/components/schemas/Fix"
          description: >-
            The ways to make the marking valid, each a whole marking the engine has read back and found valid, as
            `ProcessResult.proposedFixes`. An audit offers them because its caller is usually the author about to fix
            the document.
        appliedFixes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          description: >-
            Every change the engine made while settling the marking, as `ValidateResult.appliedFixes`. Empty when it
            made none, so a false `inputWasValid` is always explained here or in `errors`.
        rendered:
          type: string
          description: >-
            The settled marking, written as validate writes it when the request names no output: in the scheme's default
            format, or for a scheme that declares `render.surfaces`, each written surface in its default for the role
            the marking has in this document, by the rule `RenderConfigDoc.surfaces` states.
      required:
        - assertions
        - recognition
        - valid
        - inputWasValid
        - errors
        - proposedFixes
        - appliedFixes
        - rendered
      description: >-
        How an audit judged one authored marking, whole or part.


        `valid` and `inputWasValid` mean exactly what `ValidateResult` defines them to mean. An audit asks whether the
        marking was right as the author wrote it, and that is `inputWasValid`; `valid` says whether it stands once the
        engine has settled it, as it does everywhere else.


        It carries the marking's facts and how far recognition got with it, so a caller that rolls markings up, checks
        access or offers a correction works from the audit instead of reading each marking a second time.
    MatchAllNode:
      type: object
      properties:
        all:
          type: array
          items:
            $ref: "#/components/schemas/MatchNode"
          description: The signals that must all match. The first is the anchor whose span is kept.
          minItems: 1
        within:
          $ref: "#/components/schemas/Win"
          description: How close every other child's match must lie to the anchor's.
        label:
          type: string
          description: Display label for this node's matches. Defaults to `all`.
      required:
        - all
        - within
      description: >-
        The `all` combinator: every child must match, and all children must overlap within `within` of the first child's
        span. The emitted span is the first child's (the anchor). Used to require several signals co-occur.
    MatchAnyNode:
      type: object
      properties:
        any:
          type: array
          items:
            $ref: "#/components/schemas/MatchNode"
          description: The alternatives. A span any of them matches is a match.
          minItems: 1
        label:
          type: string
          description: Display label for this node's matches. Defaults to `any`.
      required:
        - any
      description: >-
        The `any` combinator: a union of child spans under one label. Used to express a multi-format value as several
        small, individually screened leaves instead of one giant alternation.
    MatchContextExpression:
      type: object
      properties:
        candidate:
          $ref: "#/components/schemas/MatchNode"
          description: The spans to keep when the cue is present.
        cue:
          $ref: "#/components/schemas/MatchNode"
          description: The span that must lie near a candidate for it to count.
        within:
          $ref: "#/components/schemas/Win"
          description: How close the cue must lie to the candidate.
        side:
          $ref: "#/components/schemas/MatchContextSide"
          description: "Where the cue may lie relative to the candidate: `before`, `after`, or `both` (the default)."
      required:
        - candidate
        - cue
        - within
      description: Cue relationship used by the context combinator.
    MatchContextNode:
      type: object
      properties:
        context:
          $ref: "#/components/schemas/MatchContextExpression"
          description: The candidate and the cue it needs.
        label:
          type: string
          description: Display label for this node's matches. Defaults to `context`.
      required:
        - context
      description: >-
        The `context` combinator: keep each `candidate` span only when a `cue` span lies within `within` on the given
        `side` (default `both`). Used to require a positive cue (e.g. a ZIP only counts with a postal/state cue nearby).
    MatchContextSide:
      type: string
      enum:
        - before
        - after
        - both
      description: Relative position accepted by a context-expression cue.
    MatchNearEmit:
      type: string
      enum:
        - a
        - b
        - envelope
      description: Span emitted by a near-expression match.
    MatchNearExpression:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/MatchNode"
          description: The first span of the pair. Kept by default.
        b:
          $ref: "#/components/schemas/MatchNode"
          description: The second span of the pair.
        within:
          $ref: "#/components/schemas/Win"
          description: How close the `b` span must lie to the `a` span.
        emit:
          $ref: "#/components/schemas/MatchNearEmit"
          description: "Which span survives a match: `a` (the default), `b`, or `envelope`, the span covering both."
      required:
        - a
        - b
        - within
      description: Pairing expression used by the near combinator.
    MatchNearNode:
      type: object
      properties:
        near:
          $ref: "#/components/schemas/MatchNearExpression"
          description: The pairing to match.
        label:
          type: string
          description: Display label for this node's matches. Defaults to `near`.
      required:
        - near
      description: >-
        The `near` combinator: pair an `a` span with a `b` span that lies within `within`. `emit` selects which span
        survives: the `a` span (default), the `b` span, or the envelope spanning both.
    MatchNode:
      anyOf:
        - $ref: "#/components/schemas/GuideMatchSpec"
        - $ref: "#/components/schemas/MatchAnyNode"
        - $ref: "#/components/schemas/MatchAllNode"
        - $ref: "#/components/schemas/MatchNotNode"
        - $ref: "#/components/schemas/MatchNearNode"
        - $ref: "#/components/schemas/MatchContextNode"
        - $ref: "#/components/schemas/MatchValidateNode"
      description: >-
        A declarative match expression: a `GuideMatchSpec` leaf, or one of the combinator nodes composed over child
        nodes. A guide rule's `match` array is a list of these.
    MatchNotNode:
      type: object
      properties:
        not:
          $ref: "#/components/schemas/MatchNode"
          description: The competing cue. A candidate with one of its spans nearby is dropped.
        of:
          $ref: "#/components/schemas/MatchNode"
          description: The candidate spans to keep or drop.
        within:
          $ref: "#/components/schemas/Win"
          description: How close a `not` span must lie to a candidate to drop it.
        label:
          type: string
          description: Display label for this node's matches. Defaults to `not`.
      required:
        - not
        - of
        - within
      description: >-
        The `not` combinator: keep each `of` candidate span only when NO `not` span lies within `within` of it. Drops a
        candidate that has a competing cue nearby.
    MatchValidateNode:
      type: object
      properties:
        validate:
          $ref: "#/components/schemas/MatchValidationExpression"
          description: The validator to run and which outcome to keep.
        label:
          type: string
          description: Display label for this node's matches. Defaults to `validate`.
      required:
        - validate
      description: >-
        The `validate` combinator: run the named validator over each `candidate` span's matched text and keep the
        candidate when the validator passes (`keep: 'pass'`, the default) or when it fails (`keep: 'fail'`). The
        validator is content-free arithmetic or structure registered in the validator registry; an unknown name is a
        load-time error.
    MatchValidationExpression:
      type: object
      properties:
        candidate:
          $ref: "#/components/schemas/MatchNode"
          description: The spans whose matched text the validator checks.
        with:
          type: string
          description: Registered validator name.
          minLength: 1
        keep:
          $ref: "#/components/schemas/MatchValidationKeep"
          description: "Which outcome keeps a candidate: `pass` (the default) or `fail`."
        args:
          description: Optional opaque arguments passed through to the validator.
      required:
        - candidate
        - with
      description: Validator invocation used by the validate combinator.
    MatchValidationKeep:
      type: string
      enum:
        - pass
        - fail
      description: Validator outcome retained by a validation expression.
    NormalizeResponse:
      type: object
      properties:
        result:
          type: string
          description: Canonical normalized form of the marking string.
      required:
        - result
      description: Response body for Context normalization.
    Notice:
      type: object
      properties:
        conceptId:
          type: string
          description: The concept the notice is attached to.
        conceptName:
          type: string
          description: The concept's display name, for showing beside the notice.
        type:
          $ref: "#/components/schemas/ConceptNoticeType"
          description: What kind of notice this is.
        text:
          type: string
          description: The notice text the marking requires.
        required:
          type: boolean
          description: Whether the notice must be shown. A host surfaces a required notice before the marking is accepted.
        views:
          $ref: "#/components/schemas/NoticeViewValues"
          description: >-
            The notice's own `ConceptNotice.views`, carried through unchanged.


            A host that emits a notice into a structured form needs the value the form's own vocabulary registers it
            under, and it has the collected notice rather than the concept it came from. Absent when the notice declares
            no registration at all.
      required:
        - conceptId
        - conceptName
        - type
        - text
        - required
      description: >-
        A notice that was resolved and collected for a specific concept in a processed marking. Notices originate from
        the concept's `documentation.notices` definitions and may be conditional (only fire when another concept is
        simultaneously asserted) or unconditional.


        Returned by `SchemeEngine.collectNotices()`, and carried on every result that describes a marking, so reading
        the notices for a processed marking does not take a second call. The `required` flag indicates whether the
        notice represents a mandatory acknowledgment the UI must surface before the user can submit the marking.
    NoticeViewValues:
      type: object
      additionalProperties:
        type: string
      description: >-
        The value a notice is registered under, keyed by view name, e.g. `{ ism: 'RD' }`.


        Structurally the same map as `ViewLabels` and deliberately not the same type. A view label is how a view spells
        something for a reader; this is the token a view's own vocabulary files the notice under, and one is never
        substitutable for the other.
    ProcessResult:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            The facts the marking states, as the engine settled them.


            Listed in print order: the order the rendered marking places each concept; a concept the rendering leaves
            out appears where it would print. A concept the rendering has no place for at all follows the others of its
            category, or comes last when its category has none, in the order the scheme declares.
        valid:
          type: boolean
          description: >-
            True when the marking stands once the engine has settled it: read, repaired, completed by what the scheme's
            rules imply, and judged with no error left.


            Defined here once, and every result that reports `valid` means this, whichever operation produced it and
            whichever door it came through. Reading is tolerant on purpose, so the engine settles what it can. Whether
            the text was right as written is what `inputWasValid` and `appliedFixes` answer; no request asks the engine
            to settle less, so validate and process give the same `valid` for the same input, context, surface and
            parts.
        inputWasValid:
          type: boolean
          description: >-
            True when the text or facts as given needed no change to stand.


            Defined here once, and judged after the same settling as `valid`. A marking can be `valid` without having
            been valid as given: the engine settled it into one that stands. A result whose `inputWasValid` is false
            always says why: each change the engine made is in `appliedFixes`, and whatever it could not settle is in
            `errors`.


            Right as written is judged against the view the text was read as, the one `recognition.inputFormat` reports,
            or for text read on more than one surface, the view each surface's part was read as. A fact settling adds,
            including a restored tier parent, counts against it only when that view writes the fact. A view that leaves
            the fact out writes the same text with the fact as without it, so the text was right already. Text read as
            no single view counts the fact when any view that read it writes it. Facts handed in with no text are judged
            against what a request that names no output writes them in, by the rule `rendered` follows.


            Text is also not right as written when the request's context names a role and recognition decided the text
            is a view of the other role, as `recognition.role` reports. The result carries that departure in
            `appliedFixes` under `_recognition_role`, and `valid` is judged as it would be without it. A request that
            names its input format has said which view the text is: the text is judged as that view, and no role
            departure is raised. On a scan region and on a marking a document audit judges, the role the marking's place
            gives it stands for the context's role: a region found inside a wrapper is a part, and an audit judges each
            marking in the role it has in the document.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
          description: >-
            What the scheme's rules find wrong with the settled marking. An entry whose severity is `error` makes
            `valid` false.


            No entry here points at a fix path: `suggestedFix` is set only on a result that carries the fix it names,
            and this result carries none.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
          description: >-
            Advisories that do not affect `valid`, such as a deprecated concept. On a process result whose fix paths
            were not all proven, this carries a notice whose `ruleId` is `_fixes_unproven`, as
            `ProcessResult.proposedFixes` describes.
        appliedFixes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          description: >-
            Every change the engine actually made while settling the marking: a departure from canonical spelling or
            order that recognition read through, a repair, a fact a rule required, a handed-in fact settling removed, or
            text read in the other role from the one the request names. A removed fact is named with the reason it was
            removed, including a fact handed in with a derived source label that the run does not derive again. A
            requirement that conflicts with an existing concept is not added and appears in errors and proposed fixes,
            with no applied change. Repair never removes an author-stated concept. These are the reasons a marking can
            be `valid` while `inputWasValid` is false.


            A departure from spelling or order is reported here without a position. On a process result,
            `recognition.corrections` reports the same departure with the span of the text it covers. They are one
            change seen two ways, so a display shows one of them, not both. The role departure, `_recognition_role`, is
            about the whole text: it has no span and no entry in `recognition.corrections`, so it is reported only here,
            and a display that shows corrections in place of this list still shows it.
        rendered:
          type: string
          description: >-
            The settled marking, in one string.


            It is written in the output the request names. With none named, a scheme without `render.surfaces` writes
            its default format, and a scheme with them writes each surface in its default for the marking's role, by the
            rule `RenderConfigDoc.surfaces` states. Every operation that returns this shape follows that one rule.


            For a scheme that declares `render.surfaces`, the string is the output resolved on each surface the result
            writes, as `RenderConfigDoc.surfaces` describes, in declared surface order and joined by
            `render.surface_separator`. An output that writes nothing adds nothing, and outputs written as XML
            attributes in one namespace merge into one attribute list. One refused output refuses the whole string, and
            `assessment` says which one and why.
        assessment:
          $ref: "#/components/schemas/RenderAssessment"
          description: >-
            The assessment of `rendered`: what it wrote of these facts, what it left out, what collapsed into an
            equivalent, and what it could not write at all. When `rendered` carries more than one surface, this is the
            combined assessment `RenderResult` describes. Read it before treating `rendered` as a transport.
        recognition:
          $ref: "#/components/schemas/RecognitionWithCorrections"
          description: >-
            What recognition made of the text, with the corrections that turn it into canonical text. Present exactly
            when there was text to recognize.
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
          description: >-
            The notices the scheme attaches to the concepts in `assertions`, collected the same way
            `SchemeEngine.collectNotices()` collects them. Always present, empty when the marking carries none, so a
            consumer can read the field without checking that it exists.
        displayColor:
          $ref: "#/components/schemas/ConceptColor"
          description: >-
            Portable scheme-derived display color for the settled marking. Embedding hosts may override this
            presentation default.
        assertionsBeforeRepair:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            What was read before repair: the assertions the input stated, before the repair pass took anything away or
            rewrote it. A retired concept appears under its replacement's name, as it does in `assertions` and in the
            fixes.


            Present only when repair rewrote something that was read. Absent, everything read came through repair. This
            is a record of the reading; proposed fixes are computed against the resulting `assertions`, never against
            this earlier set. Repair leaves author-stated rule conflicts in the resulting value for the author to
            resolve.


            Listed in print order, placed by the same rendering as `assertions`. A concept repair took away has no place
            in it, so it follows the others of its category.
        proposedFixes:
          type: array
          items:
            $ref: "#/components/schemas/Fix"
          description: >-
            The ways to make the resulting value valid, computed from that value after applied changes, each a whole
            marking the engine has read back and found valid before offering it. Empty when the marking is valid, or
            when no change the engine could prove would make it so. An error's `suggestedFix` names one of these by its
            `message`.


            A request's `parts` go back in with each fix, as the caller will send them, so they are read again in the
            fix's whole and the fix is judged with them: every part that read as a valid part marking in the call still
            does, and the fix covers every part that does. A part that did not read as a valid part marking in the call
            is one no fix to the whole can mend, so it does not keep a fix from being offered, and it may still fail
            beside the fix.


            Proofs spend what is left of the call's work budget. When a proof runs out of it, or the caller cancels the
            call, the paths not yet proven are not offered, and `warnings` carries a notice whose `ruleId` is
            `_fixes_unproven`, so a short list or an empty one is not taken for every fix there is.
        renders:
          $ref: "#/components/schemas/RenderResultsByFormat"
          description: >-
            The outputs the request named in `outputs`, one entry each, keyed by output address. Empty when the request
            named none.


            A host that binds one marking to fields written in different outputs names those outputs and gets every one
            from a single call. An output that could not write the state is present and says so in its assessment,
            because an output that refused to write a state is a different fact from one nobody asked for.
        suggestionsFor:
          $ref: "#/components/schemas/SuggestResultsByCategory"
          description: >-
            The options for each category the request named in `suggestFor`, answered against these settled facts
            exactly as `suggestForCategories` answers them, in the request's output format and surface.


            Computed only when asked. Present when the request named `suggestFor`, with one entry per category named;
            absent otherwise. It is how a composer keystroke gets the reading and the next picker's options in one round
            trip instead of two.
      required:
        - appliedFixes
        - assertions
        - assessment
        - errors
        - inputWasValid
        - notices
        - proposedFixes
        - rendered
        - renders
        - valid
        - warnings
      description: >-
        What process answers: everything validate answers, plus what an author needs to correct and finish the marking.


        Process is the author's call. A composer, a picker or an editor that helps someone write a marking calls it,
        often on every keystroke, and can send what was typed together with the facts already chosen. Beside the
        validate answer it carries:


        - the corrections that turn the text into canonical text, inside `recognition`;

        - what was read before repair, when repair changed it;

        - the fix paths, each a whole valid marking the engine has proven;

        - the outputs the request named in `outputs`, and only those;

        - the options for the categories the request named in `suggestFor`, only when it named some.


        The step-by-step trace of how the engine got here is not part of it. That is what explain answers, from the same
        request.
    ProcessingContext:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/ProcessingRole"
          description: "Role of this marking: 'whole' for overall markings, 'part' for portions"
        partOf:
          type: object
          properties:
            rendered:
              type: string
              description: Rendered string of the whole marking
            assertions:
              type: array
              items:
                $ref: "#/components/schemas/Assertion"
              description: Pre-resolved assertions of the whole marking (populated by the engine)
          required:
            - rendered
          additionalProperties: false
          description: >-
            The whole marking this is part of (when role='part').


            The whole does two jobs. In a role-aware scheme it is the reading context for the scheme's whole-aware
            rules: a rule condition with `target: 'context'` is answered from it. And in every scheme, role-aware or
            not, `process`, `validate` and `explain` compare a part that is valid on its own with its whole. That is the
            comparison a whole is judged by against its parts and the one `checkCoverage` gives, asked of this one part:
            category by category, in the direction each category's rollup declares. A category a rollup pipeline
            resolves is judged instead by what rolling the whole up with this part would add or drop. A category whose
            rollup has no direction one part can be judged by, such as `first`, is left to the whole.


            What the part carries beyond its whole is one `_exceeds_whole` error on the part. Its `affectedConcepts`
            names every finding: first what the whole does not cover, then what the whole carries that the part does not
            allow. Its `categoryId` is set when every finding is in one category. It offers no fix, because whether the
            part or the whole should change is the author's call. A part that breaks its own rules reports those errors
            and is not compared. Its own rules are the scheme's: an in-process engine's `afterValidate` plugin runs
            after the comparison and does not change whether it happens. A call's `parts` and a document scan or audit
            read each part in the whole without this comparison; they judge coverage on the whole instead.


            A part is compared with its whole as the engine settles the whole: read, modernized, completed by what the
            scheme's rules imply and judged, the same settling `valid` reports for the whole on its own. A whole spelled
            with a retired concept is compared as its replacement, and a fact the whole's rules add is one the part is
            compared with.


            The same holds wherever a part meets its whole: here; for each of a call's `parts`, however the call's whole
            came, as text or as facts; and for each input `SchemeEngineAdapter.aggregate` reads against a whole. A part
            that takes a value from its whole, such as a list it stands for, takes it from that settled whole.


            What the part gets depends on the state of its whole:


            - A whole that reads and is valid is verified. The part's rules read it, and `process`, `validate` and
            `explain` compare the part with it.

            - A whole that reads but is invalid, or does not read, is not verified. The part is still read and judged by
            its own rules but is not compared with the whole, so it never carries `_exceeds_whole`. It always carries
            the `_whole_unverified` notice.

            - With no whole given, the part is judged by its own rules alone. It carries the `_whole_unverified` notice
            only when one of its rules was left unresolved.


            Without a verified whole, what needs the whole is left open instead of guessed: a rule condition with
            `target: 'context'` is unresolved, so its rule never fires, as `RuleConditionTarget` describes.
      additionalProperties: false
      description: >-
        Caller-supplied context describing the role of a marking being processed. No context (or role='whole') means an
        overall/document-level marking. role='part' means a portion/paragraph that belongs to another marking.
    ProcessingRole:
      type: string
      enum:
        - whole
        - part
      description: Structural role of a marking within a processing operation.
    RateLimitError:
      type: object
      properties:
        error:
          type: string
          description: Always "Too Many Requests".
        retryAfter:
          type: number
          description: Seconds until the rate-limit window resets.
      required:
        - error
        - retryAfter
      description: Response body for 429 Too Many Requests.
    ReadinessWarning:
      type: string
      enum:
        - audit-degraded
        - clock-rollback
        - generation-refused
        - desired-state-stale
      description: >-
        Readiness warning codes a runtime replica reports on its readiness probe.


        A warning describes a degraded condition an operator should act on. It never changes readiness: a replica that
        is ready stays ready and keeps serving while it carries one. The set is closed so a probe consumer can alert on
        each code by name.


        `audit-degraded`: the runtime could not write one or more audit records and keeps answering requests without
        them until audit writes succeed again.


        `clock-rollback`: the system clock reads further behind a time this runtime already accepted than the tolerated
        skew allows, so license evaluation holds at that accepted time and update entitlement is suspended until the
        clock is corrected.


        `generation-refused`: a managed runtime refused what its control plane last offered, either the newest
        generation or the desired-state page as a whole, and keeps the generation it already holds, if it holds one.


        `desired-state-stale`: a managed runtime has no current signed statement from its control plane that the
        generation it serves is still the desired one. The control plane may be unreachable, or newer generations may be
        withheld on the way to the runtime. It keeps serving the generation it holds.
    ReadyResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReadyStatus"
          description: Replica readiness state; see `ReadyStatus`.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessWarning"
          description: >-
            Degraded conditions an operator should act on, in a stable order. Absent when there are none. A warning
            never changes `status`: a ready replica that carries one stays ready. Present only for an authenticated
            caller.
      required:
        - status
      description: Response body for GET /v1/ready
    ReadyStatus:
      type: string
      enum:
        - ready
        - starting
      description: >-
        Replica readiness state reported by GET /v1/ready. `ready` once the replica may receive traffic after
        RuntimeHost initialization and required-artifact checks. License expiration never takes a mission runtime out of
        service.
    RecognitionCorrection:
      type: object
      properties:
        start:
          type: integer
          description: Start offset in the input string.
        end:
          type: integer
          description: End offset in the input string.
        original:
          type: string
          description: The text as supplied.
        replacement:
          type: string
          description: The canonical text it was read as.
        reason:
          $ref: "#/components/schemas/RecognitionCorrectionReason"
          description: What kind of departure from canonical this was.
      required:
        - start
        - end
        - original
        - replacement
        - reason
      description: One span recognition rewrote, with what it was and what it became.
    RecognitionCorrectionReason:
      type: string
      enum:
        - case
        - alias
        - order
        - separator
      description: >-
        Why recognition rewrote one span of the input on the way to a reading.


        `alias` covers a concept read in a spelling the reading form does not write, the spelling another of the
        concept's views gives among them, and a prefix read in one of its `prefix_aliases`. The replacement is the
        spelling the form writes.
    RecognitionLimit:
      type: string
      enum:
        - aborted
        - input-length
        - transitions
        - lookups
        - live-states
        - wall-clock
        - grammar-size
        - depth
      description: >-
        The ceilings recognition can reach.


        Closed, because a caller distinguishing a cancelled run from an exhausted one is writing a branch, not a
        message. `aborted` is the caller's own `AbortSignal` firing, which is a ceiling in the sense that matters here:
        the answer is not a confident one. `wall-clock` is the operator's time limit, and it is a separate word from
        `transitions` because the two say different things to whoever set them: one means the input was harder than the
        work ceiling allows, the other that the host was slower than the time allowed or the input harder than both.
    RecognitionResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/RecognitionStatus"
          description: How far recognition got.
        inputFormat:
          type: string
          description: >-
            What the text was read as, when that is decided.


            For a scheme without `render.surfaces`, the format recognized, when exactly one was. For a scheme with them,
            the output address, `surface/view`, of the view the text was read as, decided as `RenderConfigDoc.surfaces`
            states: the same key that view's output has in `renders`. The form it happened to be read in is not
            reported. Absent when no one view is decided, as for text that carries the categories of more than one
            surface.
        role:
          $ref: "#/components/schemas/ProcessingRole"
          description: >-
            Whether the text is spelled as a whole or a part marking: the role of the view it was read as, or, when no
            one view is decided, the role `RenderConfigDoc.surfaces` decides for it.


            Present only for a scheme that declares `render.surfaces`, and only when that role is decided, as
            `RenderConfigDoc.surfaces` states. A request that names no output and gives no context role is written in
            its surfaces' defaults for this role. A context role the request gives, or the place a document gives the
            marking, decides the role it is judged and written in.
        surface:
          type: string
          description: >-
            The surface the input was read as, by scheme scope id.


            A caller that named a surface gets it back. A caller that named none gets the surface the recognized format
            declares, or with `render.surfaces` the surface whose categories the text carries, which tells it which part
            of a marking the text turned out to be. Absent for text that carries the categories of more than one
            surface, unless the caller named one.
        unmatched:
          type: array
          items:
            $ref: "#/components/schemas/InputSpan"
          description: Input not accounted for as content, syntax, or permitted whitespace.
      required:
        - status
        - unmatched
      description: >-
        What recognition made of an input string: how far it got, what it read, and what it could not account for.


        Every character of the marking region is accounted for: `complete` means recognized content, declared syntax, or
        permitted whitespace, with nothing left over. Finding one field is never enough to stop reading. An input that
        supports two distinct readings is `ambiguous` rather than read as either, because picking one by declaration
        order, category order, rank, or assertion count is how a guess becomes a confident answer.


        This is what a reader needs and what validate returns. Process returns `RecognitionWithCorrections`, which adds
        how to correct the text.
    RecognitionStatus:
      type: string
      enum:
        - complete
        - partial
        - ambiguous
        - unrecognized
        - resource-limit
      description: How far recognition got.
    RecognitionWithCorrections:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/RecognitionStatus"
          description: How far recognition got.
        inputFormat:
          type: string
          description: >-
            What the text was read as, when that is decided.


            For a scheme without `render.surfaces`, the format recognized, when exactly one was. For a scheme with them,
            the output address, `surface/view`, of the view the text was read as, decided as `RenderConfigDoc.surfaces`
            states: the same key that view's output has in `renders`. The form it happened to be read in is not
            reported. Absent when no one view is decided, as for text that carries the categories of more than one
            surface.
        role:
          $ref: "#/components/schemas/ProcessingRole"
          description: >-
            Whether the text is spelled as a whole or a part marking: the role of the view it was read as, or, when no
            one view is decided, the role `RenderConfigDoc.surfaces` decides for it.


            Present only for a scheme that declares `render.surfaces`, and only when that role is decided, as
            `RenderConfigDoc.surfaces` states. A request that names no output and gives no context role is written in
            its surfaces' defaults for this role. A context role the request gives, or the place a document gives the
            marking, decides the role it is judged and written in.
        surface:
          type: string
          description: >-
            The surface the input was read as, by scheme scope id.


            A caller that named a surface gets it back. A caller that named none gets the surface the recognized format
            declares, or with `render.surfaces` the surface whose categories the text carries, which tells it which part
            of a marking the text turned out to be. Absent for text that carries the categories of more than one
            surface, unless the caller named one.
        unmatched:
          type: array
          items:
            $ref: "#/components/schemas/InputSpan"
          description: Input not accounted for as content, syntax, or permitted whitespace.
        corrections:
          type: array
          items:
            $ref: "#/components/schemas/RecognitionCorrection"
          description: Departures from canonical that recognition read through.
      required:
        - corrections
        - status
        - unmatched
      description: >-
        What recognition made of an input string, with the corrections that turn it into canonical text.


        The corrections are the edit script recognition read through: each names a span of the input, what it said, and
        the canonical text it was read as. An author's editor uses them to show what changed and where. A reader has no
        use for them, which is why only process returns this form.
    ReferenceSurfaceLabel:
      type: object
      properties:
        singular:
          type: string
          description: The noun for one, such as `Handbook`.
        plural:
          type: string
          description: The noun for more than one, such as `Handbooks`.
      required:
        - singular
        - plural
      description: >-
        Resolved display label for an artifact's reference-surface chrome noun: the name its own reference component
        wears (a scheme's Handbook, a guide's Guidebook, an access policy's Access Handbook). Always fully populated: an
        artifact that declares no override resolves to the engine's generic noun for that surface, using the same
        singular/plural `Term` contract as the artifact vocabulary. Kept as its own type because this is an
        already-resolved reference-surface value rather than the complete author-facing vocabulary.
    RenderAssessment:
      type: object
      properties:
        emitted:
          type: array
          items:
            $ref: "#/components/schemas/AssertionRef"
          description: Facts this render wrote.
        omitted:
          type: array
          items:
            $ref: "#/components/schemas/AssertionRef"
          description: >-
            Facts this render did not write.


            Some of them come back when the written text is read in the same context, because the scheme derives them
            from what was written: a fact a rule adds, a category's default, a value a part takes from its whole. The
            rest are lost to the string, such as a fact of a scope or a surface this render does not write, or one a
            field that writes only its own view's spellings has no spelling for (`view_only`). Either way the string is
            a projection of the facts, and a `'full'` render refuses any omission.
        collapsed:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/AssertionRef"
          description: Groups of facts that collapsed into one written equivalent.
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/RenderFieldConflict"
          description: Fields that two assertions both claim.
        unrepresentable:
          type: array
          items:
            $ref: "#/components/schemas/UnrepresentableValue"
          description: Facts that cannot be written in this format at all, and outputs refused whole.
      required:
        - emitted
        - omitted
        - collapsed
        - conflicts
        - unrepresentable
      description: >-
        What a render did to the state it was given, bound to that state and that format.


        Answered against the state actually rendered: what was emitted, what was left out, what collapsed into an
        equivalent, and what could not be written at all.


        A caller that needs full-state preservation reads this. A caller that wants a human projection can ignore it and
        still get a useful string.
    RenderFieldConflict:
      type: object
      properties:
        field:
          type: string
          description: The field, by `name` or category id.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/AssertionRef"
          description: The assertions in conflict.
      required:
        - field
        - assertions
      description: Two fields of one format that both claim the same assertion.
    RenderFormatMode:
      type: string
      enum:
        - inline
        - block
      description: How a format runs the fields it writes together.
    RenderPreservation:
      type: string
      enum:
        - projection
        - full
      description: >-
        What a caller is asking a render for.


        `'projection'` is the ordinary human projection: the format writes the fields it declares and the assessment
        reports the rest. `'full'` is section 7.4's full-preservation request, which fails rather than returning a
        string when facts were omitted, conflicting, or unrepresentable. Naming the request is what makes the failure
        possible: a render that only ever returns a string has nowhere to say that the string is not the state.
    RenderResponse:
      type: object
      properties:
        result:
          type: string
          description: The rendered marking string.
        assessment:
          $ref: "#/components/schemas/RenderAssessment"
          description: >-
            What this render did to the state it was given: what was written, what was left out, what collapsed, what
            this format cannot write. Bound to this render, not to the format in the abstract.
      required:
        - result
        - assessment
      description: Response body for Context rendering.
    RenderResult:
      type: object
      properties:
        rendered:
          type: string
          description: The rendered marking.
        assessment:
          $ref: "#/components/schemas/RenderAssessment"
          description: What this render did to the state it was given.
      required:
        - rendered
        - assessment
      description: >-
        The output of a render: the string, and what producing it did to the state.


        The assessment travels with the string so that a convenience caller cannot accidentally treat a lossy projection
        as a transport. It is bound to this render of this state, not to the format in the abstract.


        For a scheme that declares `render.surfaces`, one result can be composed from the outputs of every surface it
        writes, and this is what such a composed result holds. The string is composed exactly as
        `ProcessResult.rendered` is. The assessment combines the surfaces written: it lists a fact as omitted only when
        no written surface wrote it, and an unrepresentable or conflicting claim from any surface stands. Such a claim
        is never cancelled because another surface wrote something.
    RenderResultsByFormat:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/RenderResult"
      description: >-
        Renders of one state, one per output, keyed by output address.


        For a scheme without `render.surfaces` the outputs are its formats, keyed by format id. For a scheme with them
        they are the views of its surfaces, keyed `surface/view` with each id percent-encoded, surfaces in declared
        order and each surface's views in theirs. Every view a surface's default names is one of its views, so a default
        has no entry of its own, and a format no view writes has none either.


        On a process result it holds exactly the outputs the request named in `outputs`. An output that was asked for
        and could not write the state says so in its assessment rather than being left out, because a missing key would
        mean nobody asked for it.
    RepairConfidence:
      type: string
      enum:
        - safe
        - uncertain
      description: Confidence assigned to a deterministic repair.
    Reproducibility:
      type: string
      enum:
        - reproducible
        - best-effort
      description: Describes whether an observed source can be loaded again byte-for-byte.
    ReproducibleRuleSourceReference:
      type: object
      properties:
        providerId:
          type: string
          description: Stable identifier for the source provider.
        reproducibility:
          type: string
          const: reproducible
          description: Whether the source observation can be reproduced byte-for-byte.
        snapshotId:
          type: string
          description: Immutable snapshot containing the rule.
      required:
        - providerId
        - reproducibility
        - snapshotId
      description: Compact source join carried by a qualified rule reference.
    ReproducibleSourceReference:
      type: object
      properties:
        reproducibility:
          type: string
          const: reproducible
          description: Whether the source observation can be reproduced byte-for-byte.
        snapshotId:
          type: string
          description: Immutable content identity.
        locator:
          type: string
          description: Location from which the content was observed.
        providerId:
          type: string
          description: Stable identifier for the source provider.
        attribution:
          $ref: "#/components/schemas/Attribution"
          description: Attribution and license information for the observed source.
      required:
        - attribution
        - providerId
        - reproducibility
        - snapshotId
      description: Reproducible source identity and mandatory attribution for an operation.
    Rollup:
      type: string
      enum:
        - max
        - min
        - union
        - intersection
        - symmetric_difference
        - exclusive_or
        - complement
        - first
        - last
        - least_upper_bound
        - pipeline
      description: >-
        Canonical rollup operator. `pipeline` requires a matching entry in the scheme's `rollup_pipelines`. Most merge
        operators are set-algebraic over each input's assertions; rank-based operators (max/min/least_upper_bound)
        require categories whose concepts declare `rank`.
    RuleCondition:
      type: object
      properties:
        category:
          type: string
          description: >-
            Category to evaluate against. Also serves as a shorthand matching any concept in this category within when
            blocks.
        has:
          type: string
          description: "Shorthand for has_concept: check if this concept is present"
        is:
          type: string
          description: Combined operator+value shorthand (e.g. "count_eq 1", "has_content")
        operator:
          type: string
          description: Explicit operator for the condition
        value:
          type:
            - string
            - number
          description: Explicit value for the operator
        role:
          $ref: "#/components/schemas/ProcessingRole"
          description: Processing context role filter
        target:
          $ref: "#/components/schemas/RuleConditionTarget"
          description: >-
            Which assertion set to evaluate: 'self' (default), 'context' (the whole marking), or 'contributors' (every
            set that fed an aggregate).
      description: >-
        A single condition in a rule's `when` block. Can test category contents, processing context role, or concept
        presence.
    RuleConditionTarget:
      type: string
      enum:
        - self
        - context
        - contributors
      description: >-
        Assertion set a rule condition is evaluated against.


        - `'self'` (default): the assertions currently under evaluation.

        - `'context'`: the assertions of the whole marking this one is part of. Such a condition has an answer only when
        the part has a verified whole, one that reads and is valid. Without one (no whole given, a whole that does not
        read, or a whole that reads but is invalid) the condition is unresolved, and so is any `all`, `any` or `none`
        around it whose answer depends on it. A rule whose `when` is unresolved never fires, changes no value, reports
        no error and offers no fix; a check rule (`require`, `require_any`, `restrict`, `forbid`, `exclusive`,
        `cardinality`) that the marking already meets still passes, and any other unresolved rule gives the part the
        `_whole_unverified` notice.

        - `'contributors'`: each contributing assertion set that went into an aggregate, evaluated separately. The
        condition holds only when EVERY contributor satisfies it, and it is never satisfied outside aggregation, where
        there are no contributors to inspect. Use it to describe what must be true of every part of a document, which
        the merged set can no longer answer once the parts have been collapsed into one.
    RuleContributorQuantifier:
      type: string
      enum:
        - any
        - all
        - none
      description: Quantifies a condition block over contributing assertion sets.
    RuleDescription:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/RuleReference"
          description: Qualified rule being described.
        guide:
          $ref: "#/components/schemas/ArtifactReference"
          description: Guide artifact that owns the rule.
        name:
          type: string
          description: Human-readable rule name.
        description:
          type: string
          description: Optional policy-authored description.
        outcomeText:
          type: string
          description: Human-readable outcome expression.
        whenText:
          type: string
          description: Human-readable activation expression.
        isComputed:
          type: boolean
          description: Whether the rule is computed from other guide facts.
        dependsOn:
          type: array
          items:
            $ref: "#/components/schemas/RuleReference"
          description: Qualified rules referenced by this rule's activation block.
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/RuleReference"
          description: Qualified rules this rule overrides when it fires.
        lines:
          type: array
          items:
            type: string
          description: Flattened multi-line description matching `ConceptDescription.lines`.
      required:
        - rule
        - guide
        - name
        - outcomeText
        - isComputed
        - dependsOn
        - overrides
        - lines
      description: Human-readable description of a guide rule. Parallels `ConceptDescription` on the scheme side.
    RuleReference:
      type: object
      properties:
        artifact:
          $ref: "#/components/schemas/ArtifactReference"
          description: Artifact that owns the rule.
        ruleId:
          type: string
          description: Rule identifier within the owning artifact.
        ruleDigest:
          type: string
          description: RFC 8785/SHA-256 digest of the canonical resolved rule content.
        source:
          $ref: "#/components/schemas/RuleSourceReference"
          description: External source identity when the rule was not supplied inline.
      required:
        - artifact
        - ruleId
        - ruleDigest
      description: Identifies the exact resolved semantics of one policy rule.
    RuleSourceReference:
      anyOf:
        - $ref: "#/components/schemas/ReproducibleRuleSourceReference"
        - $ref: "#/components/schemas/BestEffortRuleSourceReference"
      description: Compact source join carried by a qualified rule reference.
      if:
        properties:
          reproducibility:
            const: best-effort
        required:
          - reproducibility
      then:
        not:
          required:
            - snapshotId
    RuleWhen:
      anyOf:
        - type: string
        - type: array
          items:
            type: string
        - $ref: "#/components/schemas/RuleWhenQuantifier"
      description: |-
        Conditions that trigger a rule. Supports shorthand forms:

        - `string`: concept ID must be present (any category)
        - `string[]`: any of these concept IDs must be present
        - `object`: structured `{ any | all | none }` block, possibly nested
    RuleWhenNode:
      anyOf:
        - $ref: "#/components/schemas/RuleCondition"
        - $ref: "#/components/schemas/RuleWhenQuantifier"
      description: A leaf condition or recursively nested boolean quantifier in a rule tree.
    RuleWhenQuantifier:
      type: object
      properties:
        target:
          type: string
          const: contributors
          description: Evaluate this entire boolean block within each contributor.
        quantifier:
          $ref: "#/components/schemas/RuleContributorQuantifier"
          description: >-
            Combine contributor results; defaults to all. Requires target: contributors. Missing or empty contributors
            never satisfy the block.
        any:
          type: array
          items:
            $ref: "#/components/schemas/RuleWhenNode"
          description: Satisfied when at least one of these nodes is.
        all:
          type: array
          items:
            $ref: "#/components/schemas/RuleWhenNode"
          description: Satisfied when every one of these nodes is.
        none:
          type: array
          items:
            $ref: "#/components/schemas/RuleWhenNode"
          description: Satisfied when none of these nodes is.
      description: >-
        A node in a rule `when`-tree: either a leaf `RuleCondition` or a nested quantifier (`any` / `all` / `none`) over
        further nodes.


        The tree structure allows arbitrarily deep boolean logic within a rule's trigger condition. Leaf nodes test
        assertion or context state; inner nodes combine them with OR (`any`), AND (`all`), or NOT-OR (`none`).
    ScanLimits:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ScanStatus"
          description: Whether the document was read to the end, and if not, why not.
        limitHit:
          $ref: "#/components/schemas/RecognitionLimit"
          description: The ceiling that stopped the scan, when one did.
        regionsFound:
          type: integer
          description: Candidate regions the scan considered.
        regionsCapped:
          type: boolean
          description: Whether the per-document region cap was reached.
      required:
        - status
        - regionsFound
      description: >-
        How far a scan got, and what stopped it.


        A scan spends one work budget over a whole document: finding the regions a marking could occupy costs against
        it, and so does reading each one. A document large enough exhausts it, and a document that offers more regions
        than the scanner will hold is capped. Either way the answer is a shorter list of markings than the document
        holds, and a shorter list is indistinguishable from a clean one unless the scanner says so. For a scanner whose
        answer decides how a document is handled, that is the difference between "this document carries no marking" and
        "this document was not read to the end", so it is reported rather than inferred.


        `complete` means the whole document was offered to recognition. `resource-limit` means the budget was spent or
        the caller aborted, and `limitHit` names which. `truncated` means the region cap was reached with budget to
        spare. `regionsFound` is how many candidate regions the scan considered, which is the number that makes a zero
        result legible.
    ScanResponseBody:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ScanResult"
          description: The markings the scan found, in document order.
        limits:
          $ref: "#/components/schemas/ScanLimits"
          description: How far the scan got, and what stopped it.
      required:
        - results
        - limits
      description: >-
        What a scan answers on the wire.


        An object rather than a bare array, because an array alone cannot tell a document that held no marking from a
        scan that stopped before the end of it. Both come back as zero entries, and the two mean opposite things to
        whoever decides what happens to the document next.
    ScanResult:
      type: object
      properties:
        marking:
          type: string
          description: The matched marking string (as found in the document)
        start:
          type: integer
          description: Start position in the (possibly stripped) input text
        end:
          type: integer
          description: End position in the (possibly stripped) input text
        result:
          $ref: "#/components/schemas/ValidateResult"
          description: >-
            What validate answers for this marking, read where it was found and in the role `role` names. A scan reads
            documents; it does not author them, so it carries no fix paths. A caller that wants to correct one region
            processes that region.
        type:
          type: string
          description: >-
            The output this marking is written in when the scan names no output format: `result.rendered` is written in
            it.


            Without `render.surfaces`, the format id that read it, or when no single format read it, the scheme's
            default output, the `defaultRenderFormat` its metadata reports. With them, the view it was read as, the
            address `result.recognition.inputFormat` reports, when the form it was read in is one that view writes: its
            `format` or a case's format. A marking read in one form that carries more than one surface, such as an
            attribute list, is read as no one view; when the views that name that form all write it under one view id,
            it is written in them, and its type is that bare view id, the output format that writes each surface in its
            view by that id. Any other marking, one read in a form its view is only read in or read as no one view, is
            written in the default for its `role`, the `defaultWholeRenderFormat` or `defaultPartRenderFormat` its
            metadata reports, and that default is its type.
        wrapped:
          type: boolean
          description: Whether the marking was found inside a wrapper pattern (e.g., parentheses)
        inner:
          type: string
          description: >-
            The marking text inside the wrapper: the capture group of the scheme's `embeddedMarking` pattern. Present
            only when `wrapped` is true. Consumers that need to re-process the marking must use this rather than
            stripping delimiters from `marking`, because the wrapper shape is scheme-declared and is not always a pair
            of parentheses.
        role:
          $ref: "#/components/schemas/ProcessingRole"
          description: >-
            Scheme-resolved structural role of this marking: `'whole'` (a document-wide marking: a page-top marking, a
            TLP document tag) or `'part'` (a per-region marking: a paragraph mark, a segment, a tag).


            A marking found inside a wrapper is a part, because a scheme that declares a wrapper has said that is how a
            part is written. Otherwise, for a scheme that declares `render.surfaces`, it is the role recognition decides
            for it, the one `result.recognition.role` reports, and for a scheme without them, the role the scheme's
            `contextFormats` give the format it was read in. A marking with neither is a whole. Consumers should prefer
            `role` over `wrapped`, which only reflects wrapper syntax and not the scheme's whole/part intent.
      required:
        - marking
        - start
        - end
        - result
        - type
        - wrapped
        - role
      description: >-
        A single marking found during a scheme scan of free text.


        One entry of `ScanOutcome.results` per detected marking occurrence in the document. `start`/`end` are offsets in
        UTF-16 code units in the input text, suitable for overlaying highlights in a rich-text editor. `result` carries
        what validate answers for the marking, so its facts and validity are available without a second call. `wrapped`
        is `true` when the marking was found inside an `embeddedMarkingStyle` wrapper pattern (e.g., a marking in
        parentheses).
    ScanStatus:
      type: string
      enum:
        - complete
        - truncated
        - resource-limit
      description: >-
        How far a scan got.


        `complete` means the whole document was offered to recognition. `truncated` means the region cap was reached
        with budget to spare. `resource-limit` means the budget was spent or the caller aborted.
    SchemeGrammar:
      type: object
      properties:
        caseSensitive:
          type: boolean
          description: Whether the vocabulary is matched case-sensitively.
        stripWhitespace:
          type: boolean
          description: Whether surrounding whitespace is ignored when a spelling is compared.
      required:
        - caseSensitive
        - stripWhitespace
      description: >-
        Context scheme grammar response: the scheme's recognition policy.


        No separator. Every boundary belongs to the field that writes it, so there is no global one to publish; what is
        left is how a spelling found at a boundary is compared against the vocabulary.
    SchemeScope:
      type: object
      properties:
        id:
          type: string
          description: Scope identifier, referenced by `scopes` on concepts and categories.
        label:
          type: string
          description: Display label for the scope selector.
      required:
        - id
        - label
      description: One scope a scheme declares, as the scopes resource lists it.
    SchemeScopesResponse:
      type: array
      items:
        $ref: "#/components/schemas/SchemeScope"
      description: >-
        Context scheme scopes response: the declared scopes in declaration order. Empty when the scheme declares none.


        An array rather than a map, because the order is the order a selector offers them in and a JSON object does not
        carry order. Which scope is the default is the summary's `defaultScope`; no entry here marks it.
    SchemeSummary:
      type: object
      properties:
        id:
          type: string
          description: Scheme identifier from the scheme metadata.
        version:
          type: string
          description: Scheme semantic version.
        name:
          type: string
          description: Display name from the scheme metadata.
        description:
          type: string
          description: Free-text description from the scheme metadata.
        definition:
          type: string
          description: Human-readable definition of the scheme, for tooltips and about panels.
        guidance:
          type: string
          description: Usage guidance for the scheme, shown in reference views.
        colorFrom:
          type: string
          description: Single-category scheme-default color source, when category mode is used.
        colorRules:
          type: array
          items:
            $ref: "#/components/schemas/MarkingColorRule"
          description: Ordered rule-driven color outcomes, when rule mode is used.
        roleAware:
          type: boolean
          description: Whether the scheme uses role-aware processing. Omitted when unset.
        vocabulary:
          $ref: "#/components/schemas/Vocabulary"
          description: Scheme-authored display vocabulary.
        referenceSurfaceLabel:
          $ref: "#/components/schemas/ReferenceSurfaceLabel"
          description: >-
            Display label for this scheme's own reference component, the Handbook: the scheme's override or the generic
            "Handbook" / "Handbooks" when it declares none. Always populated.
        contextFormats:
          type: object
          properties:
            whole:
              type: array
              items:
                type: string
              description: Format ids a whole marking is read in.
            part:
              type: array
              items:
                type: string
              description: Format ids a part marking is read in.
          required:
            - whole
            - part
          description: >-
            Render format IDs grouped by role. For a scheme without `render.surfaces`, the lists `role_detection` gives,
            which the scanner reads a marking's role from. For a scheme with them, the scanner takes the role from the
            view a marking was read as, and these lists are derived from the views for a caller that picks a format per
            role: each role lists the forms of the views that state it, `format`, case formats and `also_read_in` in
            that order, surfaces and views in declared order and each format once.
        embeddedMarking:
          type: array
          items:
            $ref: "#/components/schemas/EmbeddedMarkingStyle"
          description: >-
            Ways a marking may appear embedded in free text. Omitted when the scheme declares none, which is how a
            client tells that inline marking is off.
        defaultScope:
          type: string
          description: >-
            Default scope id applied when a marking asserts no scope explicitly. Present exactly when the scheme
            declares scopes. Pairs with the per-category `scopes` lists on the categories sub-resource so a remote
            adapter can reconstruct which categories a scope-only assertion set targets: the metadata the assertion-set
            aggregate path needs to render scoped categories that the whole-marking format would otherwise drop.
        scopeLabel:
          type: string
          description: >-
            Display label for the scope selector shown in UIs. Omitted when the scheme declares none. Carried here so
            `getSchemeMeta` answers the same for a remote adapter as it does for a local one; without it the selector is
            labeled from the scheme document in one mode and left unlabeled in the other.
        defaultRenderFormat:
          type: string
          description: >-
            Render format applied when a call names none. A remote adapter has no way to derive this from the formats
            sub-resource: format declaration order is not default order, so a client that guesses the first entry
            renders in the wrong format whenever the two differ.


            Omitted when the scheme names no default. A client may then fall back to the first declared format, which is
            the same rule the engine applies, so both adapters render such a scheme the same way. The field is not a
            place to encode that absence: `default` is an ordinary format id, and a scheme declaring one would be
            indistinguishable from a scheme naming nothing.


            For a scheme that declares `render.surfaces`, this is the `surface/view` address of the view the default
            scope's surface writes a marking with no role in, which is its default for a whole.
        defaultPartRenderFormat:
          type: string
          description: >-
            Present only for a scheme that declares `render.surfaces`: the output address a part marking is written in
            by default. It is the `surface/view` of the default scope's surface's default for a part, from that
            surface's `default`, and does not depend on `contextFormats`, which lists the formats each role is read in.
        defaultWholeRenderFormat:
          type: string
          description: >-
            Present only for a scheme that declares `render.surfaces`: the output address a whole marking is written in
            by default, the default scope's surface's default for a whole, resolved the same way
            `defaultPartRenderFormat` is for a part.
      required:
        - id
        - version
        - name
        - description
        - referenceSurfaceLabel
      description: Context scheme summary response.
    SchemeViewResponse:
      type: object
      properties:
        id:
          type: string
          description: The scheme id.
        name:
          type: string
          description: The scheme's display name.
        description:
          type: string
          description: The scheme's description. Empty when the scheme declares none.
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The category id.
              label:
                type: string
                description: The category's display label.
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ConceptView"
                description: The category's concepts, in declared order.
            required:
              - id
              - label
              - items
          description: >-
            The scheme's categories in declared order, each with the concepts that belong to it. A category with no
            concepts is left out.
        uncategorized:
          type: array
          items:
            $ref: "#/components/schemas/ConceptView"
          description: Concepts that belong to none of the scheme's loaded categories. Usually empty.
        vocabulary:
          $ref: "#/components/schemas/Vocabulary"
          description: Display-term overrides the scheme declares, unresolved.
      required:
        - id
        - name
        - description
        - categories
        - uncategorized
      description: "Render-ready Handbook tree for a scheme: its concepts grouped under the scheme's categories."
    SortType:
      type: string
      enum:
        - position
        - alphabetical
        - numeric
      description: How concepts within a category are sorted during rendering.
    SourceReference:
      anyOf:
        - $ref: "#/components/schemas/ReproducibleSourceReference"
        - $ref: "#/components/schemas/BestEffortSourceReference"
      description: Records source identity and mandatory attribution for an operation.
      if:
        properties:
          reproducibility:
            const: best-effort
        required:
          - reproducibility
      then:
        not:
          required:
            - snapshotId
    SubjectContextRequirement:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/RuleReference"
          description: Access rule requiring the relationship.
        subjectPath:
          type: string
          description: Immutable subject operand path.
        contextPath:
          type: string
          description: Supplied context operand path.
        operator:
          type: string
          description: Comparison operator.
        acceptableValues:
          type: array
          items: {}
          description: Context values that would satisfy the relationship, when known.
        instruction:
          type: string
          description: Conditional explanation of the external-state prerequisite.
      required:
        - rule
        - subjectPath
        - contextPath
        - operator
        - instruction
      description: Conditional external relationship needed by a subject-context comparison.
    SuggestResult:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"
          description: The concepts on offer, in display order.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
          description: >-
            Advisories raised while building the options, such as a concept source that could not answer in full. Empty
            when there were none. Advisories about the marking itself belong to validate and process.
      required:
        - suggestions
        - warnings
      description: >-
        What suggest answers: the concepts a picker may offer, and nothing about the marking itself.


        How the current marking reads and whether it stands are what validate and process answer, and suggest does not
        repeat them. A caller that wants both in one round trip asks process for them with `suggestFor`.
    SuggestResultsByCategory:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/SuggestResult"
      description: >-
        Suggestions for several categories, keyed by category id.


        Each entry holds the options for its own category and no other, answered as if that category's own assertions
        were not yet chosen, so a picker can offer the alternatives to its current selection, not only what can still be
        added beside it. A label preset belongs to no category, so no entry offers one. `suggestForCategories` returns
        this, and so does a process call that names categories in `suggestFor`.
    Suggestion:
      type: object
      properties:
        conceptId:
          type: string
          description: The id of the suggested concept.
        categoryId:
          type: string
          description: The category the concept belongs to.
        label:
          type: string
          description: Primary display label in the current render format.
        description:
          type: string
          description: Secondary label (longer name or alternate view).
        name:
          type: string
          description: Human-readable concept name.
        views:
          type: object
          additionalProperties:
            type: string
          description: All views for this concept.
        group:
          type: string
          description: Category label for UI grouping.
        selected:
          type: boolean
          description: True if this concept is already in the current marking.
        order:
          type: integer
          description: Sort order.
        source:
          type: string
          enum:
            - parse
            - preset
            - alias
          description: >-
            `preset` on a row that offers a label preset, whose `conceptId` is `preset:` followed by the preset id. A
            concept row leaves it unset.
        gated:
          type: boolean
          description: >-
            True when this concept matches the active filter but is currently gated by the scheme's rules (a rule
            prerequisite is unmet, or a constraint forbids it). Gated suggestions are surfaced as non-selectable,
            explanatory rows so the user can see why the concept is unavailable. Only populated when the caller passes
            `includeGated: true` and a filter is active.
        requires:
          type: array
          items:
            type: string
          description: >-
            When `gated` is true, the unmet prerequisite concept ids that would unlock this concept. Empty array when
            the concept is gated by a constraint with no specific prerequisite (e.g. mutual exclusion).
        requiresDisplay:
          type: array
          items:
            type: string
          description: >-
            Resolved operational display (rendered marking view) for each id in `requires`, index-aligned, so the unlock
            row can read "add X first" with the marking rather than the raw id. `requires` stays as the machine keys.
      required:
        - conceptId
        - categoryId
        - label
        - description
        - name
        - views
        - group
        - selected
        - order
      description: >-
        A concept offered to the user in the suggest UI, with label, description, group, and current selection state.


        Returned in `SuggestResult.suggestions`. `selected: true` means the concept is already in the current marking;
        clicking it again removes it. `order` controls display position within the group. `views` carries all
        render-format representations so the UI can switch formats without a second query. `source` distinguishes
        concepts from parsing the input (`'parse'`), preset shortcuts (`'preset'`), or alias matches (`'alias'`).
    Term:
      type: object
      properties:
        singular:
          type: string
          description: The word for one, such as `rule`.
        plural:
          type: string
          description: The word for more than one, such as `rules`.
      description: A singular/plural display-word pair.
    TextValueEncoding:
      type: object
      properties:
        type:
          type: string
          const: text
          description: Plain text, stored exactly as supplied.
        maxLength:
          type: integer
          description: Reject a value longer than this many characters.
        pattern:
          type: string
          description: >-
            A validation constraint: the value is rejected unless the whole of it matches. Never a recognition device,
            and nothing is extracted from it.
      required:
        - type
      description: A free-text value stored exactly as supplied.
    TierComposition:
      type: object
      properties:
        tier:
          type: string
          description: The tier label this entry governs.
        attachedBy:
          type: string
          description: What attaches this tier level to the one it composes with.
        view:
          type: string
          description: View for the composed token's child; falls back to the field's view.
        headView:
          type: string
          description: View for the composed token's head; falls back to the field's view.
      required:
        - tier
        - attachedBy
      description: >-
        How a tiered concept composes inside one field: what attaches a tier level to the one above it, and the view
        each half of the composed token is written in.


        The head is the level being composed with and the child is the level this entry governs. They need not agree: a
        format that spells its concepts out can still want the head short inside a composed token, where the composed
        form is a name in its own right. Either falls back to the field's view, and neither reaches a head written on
        its own.
    TokenWindow:
      type: object
      properties:
        tokens:
          type: integer
          description: >-
            The largest distance allowed between two spans, counted in whitespace-delimited tokens between their nearest
            edges.
          minimum: 0
      required:
        - tokens
      description: Proximity measured in whitespace-delimited tokens.
    TraceEntry:
      type: object
      properties:
        stage:
          type: string
          description: >-
            The pipeline stage that acted, such as `parse`, `normalize`, `repair`, `infer`, `validate`, `render`,
            `aggregate` or `context`. An open string.
        action:
          type: string
          description: >-
            What the stage did, as a short machine-readable token, such as `asserted`, `inferred`, `removed` or
            `unmatched`. An open string.
        detail:
          type: string
          description: >-
            A sentence describing the step for a person. It is prose and must not be parsed; the structured fields carry
            the ids.
        conceptId:
          type: string
          description: The concept the step acted on, when it acted on one.
        conceptName:
          type: string
          description: >-
            Resolved operational display for `conceptId` (the concept's rendered marking view), so a "why" breakdown UI
            can show the marking rather than the raw id. `conceptId` stays as the machine key.
        categoryId:
          type: string
          description: >-
            Category the action landed in, when the acting rule declared one. This is the structured channel for the
            category: `detail` is human-facing prose and must never be parsed to recover it.
        ruleId:
          type: string
          description: The scheme rule that drove the step, when one did.
        triggerConceptIds:
          type: array
          items:
            type: string
          description: Concept IDs that triggered the rule producing this entry.
      required:
        - stage
        - action
        - detail
      description: >-
        One step in the engine's explanation trace: which stage acted, what it did, and which concept/rule was involved.


        Lives in `ExplanationTrace.entries`. Consumers use the trace to render a "why was this marking produced?"
        breakdown. `stage` is one of `parse | repair | infer | validate | render`; `conceptId` and `ruleId` identify the
        specific element that drove the action.
    TraceInference:
      type: object
      properties:
        ruleId:
          type: string
          description: The id of the inference rule that fired.
        conceptId:
          type: string
          description: The concept the rule added.
        conceptName:
          type: string
          description: >-
            Resolved operational display for `conceptId` (the concept's rendered marking view), so a "why" breakdown UI
            can show the inferred marking rather than the raw id. `conceptId` stays as the machine key.
        explanation:
          type: string
          description: Why the rule added the concept, in words.
      required:
        - ruleId
        - conceptId
        - explanation
      description: Inference recorded in an explanation trace.
    TraceRepair:
      type: object
      properties:
        ruleId:
          type: string
          description: The id of the repair rule that fired.
        description:
          type: string
          description: What the repair does, as the scheme describes it.
        confidence:
          $ref: "#/components/schemas/RepairConfidence"
          description: The confidence the scheme declares for the repair rule.
        before:
          type: string
          description: The text before the repair.
        after:
          type: string
          description: The text after the repair.
        cosmetic:
          type: boolean
          description: True when the repair changed only formatting and left the assertions as they were.
      required:
        - ruleId
        - description
        - confidence
        - before
        - after
      description: Repair recorded in an explanation trace.
    TraceValidationIssue:
      type: object
      properties:
        constraintId:
          type: string
          description: The id of the constraint that failed.
        message:
          type: string
          description: What is wrong, in words.
      required:
        - constraintId
        - message
      description: >-
        Validation issue recorded in an explanation trace: the constraint that failed and its message, and nothing else.
        The category, severity and concepts of the error it came from belong to the error, which a validate or process
        result reports in `errors`.
    UnrepresentableFact:
      type: object
      properties:
        conceptId:
          type: string
          description: The concept that cannot be written.
        reason:
          $ref: "#/components/schemas/UnrepresentableFactReason"
          description: Why this format cannot write it.
        detail:
          type: string
          description: Human-readable detail, for a message rather than a branch.
      required:
        - conceptId
        - reason
      description: A fact this format has no way to write.
    UnrepresentableFactReason:
      type: string
      enum:
        - unframable
        - reserved-literal
        - ambiguous-identity
        - no-field
        - no-view
        - value-lossy
      description: >-
        Why this format cannot write a fact it was given.


        Closed, like the recognition-side reasons. `unframable` is a value carrying a character the syntax cannot frame;
        `reserved-literal` a free value equal to a fixed instruction beside it, which would read back as the other
        concept; `ambiguous-identity` a value indistinguishable from a differently typed one; `no-field` a fact this
        format's tree has no field for; `no-view` a concept with no spelling in this format's view; `value-lossy` a
        concept this format writes without its captured text.
    UnrepresentableOutput:
      type: object
      properties:
        output:
          type: string
          description: The output refused, by its `surface/view` address.
        reason:
          $ref: "#/components/schemas/UnrepresentableOutputReason"
          description: Why it was refused.
        detail:
          type: string
          description: Human-readable detail, for a message rather than a branch.
      required:
        - output
        - reason
      description: >-
        An output refused whole. Only a scheme that declares `render.surfaces` refuses one, because only its views
        choose a format by condition, and a choice that cannot be made is not a fact some format failed to write.
    UnrepresentableOutputReason:
      type: string
      enum:
        - unresolved-context
        - ambiguous-representation
      description: >-
        Why an output was refused whole, before any of its facts was written.


        Closed. `unresolved-context` is an output whose choice of format turns on a condition the operation cannot
        decide, such as one that reads context the caller did not supply. `ambiguous-representation` is an output with
        more than one representation in force and nothing to choose between them, such as two of its cases holding at
        once.
    UnrepresentableValue:
      anyOf:
        - $ref: "#/components/schemas/UnrepresentableFact"
        - $ref: "#/components/schemas/UnrepresentableOutput"
      description: >-
        Something a render could not write: one fact, or a whole output. `reason` tells the two apart, and only a fact
        carries a `conceptId`.
    ValidateResult:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            The facts the marking states, as the engine settled them.


            Listed in print order: the order the rendered marking places each concept; a concept the rendering leaves
            out appears where it would print. A concept the rendering has no place for at all follows the others of its
            category, or comes last when its category has none, in the order the scheme declares.
        valid:
          type: boolean
          description: >-
            True when the marking stands once the engine has settled it: read, repaired, completed by what the scheme's
            rules imply, and judged with no error left.


            Defined here once, and every result that reports `valid` means this, whichever operation produced it and
            whichever door it came through. Reading is tolerant on purpose, so the engine settles what it can. Whether
            the text was right as written is what `inputWasValid` and `appliedFixes` answer; no request asks the engine
            to settle less, so validate and process give the same `valid` for the same input, context, surface and
            parts.
        inputWasValid:
          type: boolean
          description: >-
            True when the text or facts as given needed no change to stand.


            Defined here once, and judged after the same settling as `valid`. A marking can be `valid` without having
            been valid as given: the engine settled it into one that stands. A result whose `inputWasValid` is false
            always says why: each change the engine made is in `appliedFixes`, and whatever it could not settle is in
            `errors`.


            Right as written is judged against the view the text was read as, the one `recognition.inputFormat` reports,
            or for text read on more than one surface, the view each surface's part was read as. A fact settling adds,
            including a restored tier parent, counts against it only when that view writes the fact. A view that leaves
            the fact out writes the same text with the fact as without it, so the text was right already. Text read as
            no single view counts the fact when any view that read it writes it. Facts handed in with no text are judged
            against what a request that names no output writes them in, by the rule `rendered` follows.


            Text is also not right as written when the request's context names a role and recognition decided the text
            is a view of the other role, as `recognition.role` reports. The result carries that departure in
            `appliedFixes` under `_recognition_role`, and `valid` is judged as it would be without it. A request that
            names its input format has said which view the text is: the text is judged as that view, and no role
            departure is raised. On a scan region and on a marking a document audit judges, the role the marking's place
            gives it stands for the context's role: a region found inside a wrapper is a part, and an audit judges each
            marking in the role it has in the document.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
          description: >-
            What the scheme's rules find wrong with the settled marking. An entry whose severity is `error` makes
            `valid` false.


            No entry here points at a fix path: `suggestedFix` is set only on a result that carries the fix it names,
            and this result carries none.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
          description: >-
            Advisories that do not affect `valid`, such as a deprecated concept. On a process result whose fix paths
            were not all proven, this carries a notice whose `ruleId` is `_fixes_unproven`, as
            `ProcessResult.proposedFixes` describes.
        appliedFixes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          description: >-
            Every change the engine actually made while settling the marking: a departure from canonical spelling or
            order that recognition read through, a repair, a fact a rule required, a handed-in fact settling removed, or
            text read in the other role from the one the request names. A removed fact is named with the reason it was
            removed, including a fact handed in with a derived source label that the run does not derive again. A
            requirement that conflicts with an existing concept is not added and appears in errors and proposed fixes,
            with no applied change. Repair never removes an author-stated concept. These are the reasons a marking can
            be `valid` while `inputWasValid` is false.


            A departure from spelling or order is reported here without a position. On a process result,
            `recognition.corrections` reports the same departure with the span of the text it covers. They are one
            change seen two ways, so a display shows one of them, not both. The role departure, `_recognition_role`, is
            about the whole text: it has no span and no entry in `recognition.corrections`, so it is reported only here,
            and a display that shows corrections in place of this list still shows it.
        rendered:
          type: string
          description: >-
            The settled marking, in one string.


            It is written in the output the request names. With none named, a scheme without `render.surfaces` writes
            its default format, and a scheme with them writes each surface in its default for the marking's role, by the
            rule `RenderConfigDoc.surfaces` states. Every operation that returns this shape follows that one rule.


            For a scheme that declares `render.surfaces`, the string is the output resolved on each surface the result
            writes, as `RenderConfigDoc.surfaces` describes, in declared surface order and joined by
            `render.surface_separator`. An output that writes nothing adds nothing, and outputs written as XML
            attributes in one namespace merge into one attribute list. One refused output refuses the whole string, and
            `assessment` says which one and why.
        assessment:
          $ref: "#/components/schemas/RenderAssessment"
          description: >-
            The assessment of `rendered`: what it wrote of these facts, what it left out, what collapsed into an
            equivalent, and what it could not write at all. When `rendered` carries more than one surface, this is the
            combined assessment `RenderResult` describes. Read it before treating `rendered` as a transport.
        recognition:
          $ref: "#/components/schemas/RecognitionResult"
          description: >-
            What recognition made of the text: how far it got, what it read the text as, and what it could not account
            for.


            Present exactly when there was text to recognize. Given facts, nothing was read, and the field is absent
            rather than carrying a made-up status about an input that does not exist. The same holds for every other
            result built from carried facts, notably a crosswalk's target.
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
          description: >-
            The notices the scheme attaches to the concepts in `assertions`, collected the same way
            `SchemeEngine.collectNotices()` collects them. Always present, empty when the marking carries none, so a
            consumer can read the field without checking that it exists.
        displayColor:
          $ref: "#/components/schemas/ConceptColor"
          description: >-
            Portable scheme-derived display color for the settled marking. Embedding hosts may override this
            presentation default.
      required:
        - assertions
        - valid
        - inputWasValid
        - errors
        - warnings
        - appliedFixes
        - rendered
        - assessment
        - notices
      description: >-
        What validate answers about one marking: the facts it states once settled, whether they stand, and what a reader
        needs to show why not.


        Validate is the reader's call. A host that displays a marking, gates on it, stores it, or hands its facts to an
        access check or a rollup calls it. The result carries no fix paths, no corrections to the text and no output
        beyond the one rendering, because a reader is not writing the marking. The author's call is process, and a
        `ProcessResult` is this result with the authoring answers added.


        Each field means the same wherever it appears: on a validate or process result, on each region of a scan,
        in-process or over a wire.


        Scheme and engine metadata (schemeVersion, schemeId) are not on the result; read them from `engine.version`,
        `engine.scheme.id` and `engine.scheme.version` instead.
    ValidationError:
      type: object
      properties:
        constraintId:
          type: string
          description: "The id of the constraint that was violated: a scheme rule's id, or an engine-reserved id beginning with `_`."
        message:
          type: string
          description: What is wrong, in words a person can act on.
        categoryId:
          type: string
          description: Category ID this error relates to (when determinable from the constraint).
        severity:
          $ref: "#/components/schemas/ValidationSeverity"
          description: "Severity: 'error' blocks validity, 'warning' is advisory. Default: 'error'."
        affectedConcepts:
          type: array
          items:
            type: string
          description: Concept IDs involved in this validation failure.
        suggestedFix:
          type: string
          description: >-
            The `message` of the proposed fix that answers this error, such as "Add CTRL-A".


            Set only on a result that carries that fix in its own `proposedFixes`. A result with no fix paths, such as a
            `ValidateResult` or a scan region, never sets it, so a reader never holds a pointer to a fix it was not
            given.
        didYouMean:
          type: array
          items:
            type: string
          description: >-
            The ids of the concepts the unread token was likely meant as. Never empty. They are ids for a program to act
            on, not spellings to show an author: `message` gives the same hint in words, naming the spellings.


            Set only on an `_unmatched_token` error, which is about one token the engine could not read, and only when
            that token reads as a misspelling of some concept's spelling. The concepts named are tied for nearest, so
            their order ranks none above another.


            Its absence is no evidence that the token is stray text. A token too short to judge carries none, and so
            does one equally near to too many concepts. A token that already spells a concept, apart from case, carries
            none even when it is also near another concept: it was left unread for another reason, such as where it
            stands, and naming a different concept would point the author away from a word they spelled right.


            It is not a fix: nothing here has been proven to make the marking valid, and `suggestedFix` and the result's
            fix paths do not depend on it.
          minItems: 1
      required:
        - constraintId
        - message
      description: >-
        A constraint violation detected during validation, referencing the constraint ID and a human-readable message.


        Carried in the `errors` of every result that judges a marking. `constraintId` identifies the rule that fired;
        `message` is human-readable. When `severity` is `'warning'`, the violation is advisory and does not set `valid`
        to `false`. Use `categoryId` and `affectedConcepts` to highlight the specific UI elements involved.


        Two of the ids the engine keeps for itself are for a fact a caller hands in that cannot be settled as given:
        `_missing_assertion_value`, a concept that takes a value handed in with none, and `_invalid_assertion_value`, a
        value the concept's encoding cannot read. Each is an error on the result, not a refused request: the fact is
        left out of the settled marking and named in `affectedConcepts`.


        Another, `_exceeds_whole`, is a part that carries more than the whole it is read in: the whole does not cover a
        value the part holds, carries one the part does not allow, or, in a category a rollup pipeline resolves, would
        change if rolled up with the part. It is given only for a part that is valid on its own, read in a whole that
        reads and is valid. `affectedConcepts` names every finding, and no fix answers it. See
        `ProcessingContext.partOf`.
    ValidationSeverity:
      type: string
      enum:
        - error
        - warning
      description: Severity assigned to a validation issue.
    ValueEncoding:
      anyOf:
        - $ref: "#/components/schemas/TextValueEncoding"
        - $ref: "#/components/schemas/CalendarDateValueEncoding"
        - $ref: "#/components/schemas/CompositeValueEncoding"
      description: >-
        How a free-text value is spelled and stored: the resolved codec.


        A codec, not a validator. Every encoding states both directions, so a value this contract accepts is a value it
        can write back.
    Vocabulary:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Term"
      description: >-
        Author-facing vocabulary: an open map from a term key (e.g. "rule", "concept", "tag") to the display words. Term
        keys are not enumerated here; consumers pick the keys that matter to them.


        Purely a presentation hint: nothing in the engine's evaluation logic reads it. Each consumer owns its own
        default map and calls `resolveVocabulary(source, defaults)` to merge.
    Warning:
      type: object
      properties:
        ruleId:
          type: string
          description: >-
            The scheme rule that gave a `rule` warning, or the engine-reserved id of a `notice`. Absent on a deprecation
            warning.
        conceptId:
          type: string
          description: >-
            Concept this warning relates to (when applicable). A rule warning names one when the rule's `when` names
            exactly one concept the marking holds.
        conceptName:
          type: string
          description: >-
            Resolved operational display for `conceptId` (the concept's rendered marking view), for a consumer that
            shows the warning next to the concept. `conceptId` stays as the machine key; this is the human-visible
            string.
        categoryId:
          type: string
          description: Category this warning relates to (when applicable)
        kind:
          $ref: "#/components/schemas/WarningKind"
          description: >-
            Warning kind: 'deprecation' for a deprecated concept, 'rule' for a scheme's authored `warn` rule, 'notice'
            for the engine's own notice.
        message:
          type: string
          description: Human-readable message
        replacement:
          type: string
          description: When kind=deprecation, the suggested replacement concept id (if any)
        replacementName:
          type: string
          description: >-
            When kind=deprecation, the resolved operational display for `replacement` (the successor concept's rendered
            marking view). `replacement` stays as the machine key; this is the human-visible string.
      required:
        - kind
        - message
      description: >-
        A non-blocking informational signal surfaced in a result's `warnings`.


        Unlike `ValidationError`, warnings never affect `valid`. `kind: 'deprecation'` fires when a deprecated concept
        is asserted, and `replacement` names a suggested successor concept. `kind: 'rule'` fires when a scheme's
        authored `warn` rule matches the marking, with the rule's id as `ruleId`. `kind: 'notice'` is the engine
        speaking about the operation itself rather than about anything the scheme declares; its `ruleId`, when present,
        is an engine-reserved id beginning with `_`, the same convention a `ValidationError` follows.


        A marking's warnings come in a fixed order: deprecations first, then the scheme's rule warnings in the order the
        scheme declares its rules, then the engine's notices. An aggregate's warnings are about the rolled-up marking,
        not about each marking that fed it.
    WarningKind:
      type: string
      enum:
        - deprecation
        - rule
        - notice
      description: >-
        Non-blocking warning category: a deprecated concept, a scheme's authored `warn` rule, or a notice the engine
        gives about the operation itself.
    Win:
      anyOf:
        - $ref: "#/components/schemas/TokenWindow"
        - $ref: "#/components/schemas/CharacterWindow"
      description: >-
        A bounded proximity window. Exactly one token or character bound is present, so a windowed operation can never
        widen to the whole line accidentally.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token presented on every data-path request. A deployment that runs without authentication ignores it. One
        that requires it answers an unauthenticated request with the same not-found shape a missing resource gets, so a
        caller learns nothing about what exists from being refused. That is why no operation here declares a 401 or a
        403: the server does not emit them.
    contextToken:
      type: apiKey
      in: header
      name: x-ezclassify-context-token
      description: >
        Signed, deployment-scoped Context authorization presented on every Context data-path request. This credential is
        independent of caller identity: the bearer token identifies the principal, while this token proves that the
        deployment authorizes the requested Context and version. Refusals use the same constant not-found response as
        every other authorization failure.
  headers:
    ResolvedVersion:
      description: >
        The concrete semver version the request resolved to. A route under /v1/ctx/{ctxId}/{version} accepts "latest" as
        its version, and an operation route also accepts the version segment left out; this header reports what the
        server actually served, so callers always know the resolved version even when they didn't ask for one
        explicitly.
      schema:
        type: string
      example: 1.2.0
  responses:
    BadRequest:
      description: |
        Invalid or missing request parameters, or a query parameter or body field the operation does not declare
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Missing required field: input"
    Conflict:
      description: The request references state that is no longer current
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: A supplied guide determination is stale
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: No scheme files found in /app/schemes
    NotReady:
      description: Replica has not activated a generation or finished its startup checks
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReadyResponse"
          example:
            status: starting
    NotFound:
      description: >
        Context or resource not found. A request that reached routing and matched no route carries `code:
        route_not_found`; a request refused before routing carries the constant refusal body, which has no `code` by
        design. Branch on the code, never on the message. See the API description for why the two bodies differ.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            resourceAbsent:
              summary: The route exists and the resource does not
              value:
                error: "Context not found: nonexistent-context"
            routeAbsent:
              summary: The request reached routing and matched no route
              value:
                error: "Not found: /v1/unknown"
                code: route_not_found
            refused:
              summary: >
                Refused before routing. Constant and codeless on purpose, so a caller learns nothing about what exists
                from being refused.
              value:
                error: not_found
    UnprocessableEntity:
      description: >
        The request is well formed, but the Context cannot serve it: the Context has no component of the kind the
        operation needs, or a component it names could not be loaded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Context has no access policy attached.
    TooManyRequests:
      description: >
        Rate limit exceeded. The rate limiter answers ahead of every route, so any operation can return this. Wait the
        number of seconds in `Retry-After` (the same value as the body's `retryAfter`) before retrying.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate-limit window resets
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests allowed per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when the window resets
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"
          example:
            error: Too Many Requests
            retryAfter: 42
