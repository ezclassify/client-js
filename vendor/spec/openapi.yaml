          description: Mapping decision, or `unmapped` when the artifact has no rule.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkTarget"
          description: Emitted targets for `carry`, proposed targets for `review`.
        reason:
          type: string
          description: Reviewable explanation of the decision.
        authority:
