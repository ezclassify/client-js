  /v1/ctx/{ctxId}/{version}/crosswalk/translate:
    post:
      operationId: ctxCrosswalkTranslate
      summary: Translate a marking through a crosswalk in a context
      description: >-
        Applies the named directional crosswalk to a SOURCE and returns the treatment of every source assertion: what
        was carried, what needs review, and what no mapping covers. A prohibition stops the translation before target
        processing and the response says which one. The source is either a rendered `marking` string or its structured
        `assertions` form: send exactly one of the two, because a request with neither has no source and a request with
