    DocumentUnmarkedSpan:
      type: object
      properties:
        start:
          type: integer
          description: Zero-based inclusive offset in the accepted document.
        end:
          type: integer
          description: Zero-based exclusive offset in the accepted document.
        offsetEncoding:
          type: string
          const: utf-8-bytes
          description: Frozen byte-offset encoding.
        text:
          type: string
          description: Authored text, omitted outside the full response profile.
      required:
        - start
        - end
        - offsetEncoding
      description: A document range not governed by an authored marking.
    DocumentWholeOccurrence:
      type: object
      properties:
        marking:
          type: string
          description: The whole marking as the document writes it.
        start:
          type: integer
          description: Zero-based inclusive UTF-8 byte offset.
        end:
          type: integer
          description: Zero-based exclusive UTF-8 byte offset.
        offsetEncoding:
          type: string
          const: utf-8-bytes
          description: Frozen byte-offset encoding.
      required:
        - marking
        - start
        - end
        - offsetEncoding
      description: One authored document-wide marking occurrence.
    EachAffix:
      type: object
      properties:
        prefix:
          type: string
          description: Written before each value.
        suffix:
          type: string
          description: Written after each value.
      description: Affix written around every value of a field, rather than once around all of them.
    EffectiveDocumentTarget:
      type: object
      properties:
        basis:
          $ref: "#/components/schemas/AccessScenarioBasis"
          description: Authority basis used to construct the target.
        marking:
          type: string
          description: Scheme-rendered effective marking.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            Effective assertions evaluated by access policy, listed in print order: the order `marking` places each
            concept; a concept it leaves out appears where it would print.
        authoredWhole:
          type: string
          description: Authored document-wide marking when present.
        authoredParts:
          type: array
          items:
            type: string
          description: Authored part markings.
        determinedGuideRequiredWhole:
          type: string
          description: Whole required by accepted/manual guide facts.
        projectedGuideRequiredWhole:
          type: string
          description: Advisory whole additionally assuming unresolved nominations.
      required:
        - basis
        - marking
        - assertions
        - authoredParts
      description: Effective marking/assertion target evaluated in one access scenario.
    EmbeddedMarkingStyle:
      type: object
      properties:
        pattern:
          type: string
          description: >-
            RegExp source (no flags) whose first capture group is the raw marking text. Example: `\((.+)\)` for a
            marking in parentheses.
        template:
          type: string
          description: >-
            Template used when inserting a new embedded marking. Must include the literal token "{marking}" where the
            rendered marking is substituted. Example: "({marking}) ".
        autoInsert:
          $ref: "#/components/schemas/EmbeddedMarkingStyleAutoInsert"
          description: >-
            When the host UI should proactively prompt the user to add a marking. "every-paragraph" pops the picker on
            each new paragraph; "first-line" only on the first line of the document; "manual" never auto-prompts.
            Default "manual".
      required:
        - pattern
        - template
      description: >-
        One way a marking can appear embedded inside free text, e.g. a parenthesized short form like "(H)" at the start
        of a paragraph. A scheme may declare multiple styles; all are matched during scanning.
    EmbeddedMarkingStyleAutoInsert:
      type: string
      enum:
        - every-paragraph
        - first-line
        - manual
      description: When a host UI should proactively prompt for an embedded marking.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: >-
            Human-readable error message. Prose for an operator, not a contract: a client that branches on this string
            breaks the first time the wording is improved. Branch on `code` instead.
        code:
          type: string
          description: >-
            Stable machine-readable classification of the failure, present whenever the server can name one. Set to
            `INVALID_INPUT` when the failure originated in engine input or the request carried something the operation
            does not declare, and to `route_not_found` on a 404 that reached routing and matched no route. A request
            refused before routing carries the constant refusal body instead, which has no `code` at all by design, so
            the absence of a code on a 404 is itself uninformative.
        detail:
          type: string
          description: >-
            What the failure is about, beside `code`: a stable operation-specific detail used to classify it. For a
            request that names a format, a concept or a category the scheme does not declare, it is the request field
            and the id it named, written `field: id`, such as `outputFormat: nope` or `conceptId: NOPE`. For a request
            that carries a query parameter the operation does not declare, it is `query: ` and the parameter's name; for
            an undeclared body field, `body`, the JSON pointer of the object that holds it, `: ` and the field, such as
            `body: extra` or `body/context: extra`. Never a scheme's internals.
      required:
        - error
      description: Response body for error responses (4xx / 5xx).
    EvaluationResult:
      type: object
      properties:
        guideId:
          type: string
          description: The id of the guide evaluated. Absent when the result combines several guides.
        selectedRules:
          type: array
          items:
            $ref: "#/components/schemas/GuideRule"
          description: >-
            The selected rules that were evaluated. Rules with a `when` condition are computed, not selected, and are
            not listed here.
        activeComputedRules:
          type: array
          items:
            $ref: "#/components/schemas/GuideRule"
          description: The computed rules whose `when` condition the selection satisfied.
        effectiveMarkings:
          type: array
          items:
            type: string
          description: The marking each contributing rule's outcome resolves to. Overridden rules contribute none.
        aggregatedMarking:
          type: string
          description: >-
            The effective markings rolled up into one marking by the target scheme. Empty when no rule contributed, or
            when the result spans more than one target scheme, in which case `aggregatedMarkings` holds one per scheme.
        aggregatedMarkings:
          $ref: "#/components/schemas/AggregatedMarkings"
          description: >-
            Aggregated output keyed by target scheme id. Present when guide evaluation routed through more than one
            target scheme.
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/GuideBreakdownEntry"
          description: "One entry per evaluated rule: for each guide, its selected rules, then its computed rules."
        contributingBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/GuideBreakdownEntry"
          description: >-
            Subset of `breakdown` that actually contributed to `aggregatedMarking` (i.e. `breakdown.filter(b =>
            !b.wasOverridden)`). Precomputed so UI layers stop re-filtering the full breakdown.
        provenance:
          $ref: "#/components/schemas/SourceReference"
          description: External guide-rule source observation used by this evaluation.
      required:
        - selectedRules
        - activeComputedRules
        - effectiveMarkings
        - aggregatedMarking
        - breakdown
        - contributingBreakdown
      description: >-
        Output of GuideEngine.evaluate(): the aggregate marking produced by evaluating a set of selected guide rules.
        Parallels SchemeEngine.process() on the scheme side.
    ExplanationTrace:
      type: object
      properties:
        input:
          type: string
          description: The marking text the explanation was asked for, as given.
        schemeId:
          type: string
          description: The id of the scheme the marking was read against.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TraceEntry"
          description: Every step the pipeline took, in the order it took them.
        repairs:
          type: array
          items:
            $ref: "#/components/schemas/TraceRepair"
          description: Each repair rule that rewrote the input, in the order applied.
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/TraceValidationIssue"
          description: The constraints the settled marking violates.
        inferences:
          type: array
          items:
            $ref: "#/components/schemas/TraceInference"
          description: Each concept an inference rule added, in the order added.
        finalAssertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: The assertions the pipeline settled on, listed in print order as a validate result's `assertions` are.
        rendered:
          type: string
          description: The settled marking, written in the output format.
      required:
        - input
        - schemeId
        - entries
        - repairs
        - validationErrors
        - inferences
        - finalAssertions
        - rendered
      description: >-
        Full pipeline trace for one marking: parse input, repairs applied, inferences drawn, validation errors, and the
        final output.


        What `explain` returns, and nothing else. It takes what `process` takes and answers why the engine settled the
        marking the way it did, step by step. No other result carries it, because their callers want the answer rather
        than the working. Debug tools use this to explain why a marking was accepted or rejected. `repairs` lists each
        repair rule that fired and the before/after strings. `inferences` lists each inference rule that added a concept
        and the reason text.
    FilterResult:
      type: object
      properties:
        visibleIds:
          type: array
          items:
            type: string
          description: IDs of concepts or rules that matched the query.
        categoryCounts:
          type: object
          additionalProperties:
            type: object
            properties:
              visible:
                type: integer
                description: Items in the category that matched the query.
              total:
                type: integer
                description: Items in the category.
            required:
              - visible
              - total
          description: Per-category counts.
        total:
          type: object
          properties:
            visible:
              type: integer
              description: Items that matched the query.
            total:
              type: integer
              description: Items in every category.
          required:
            - visible
            - total
          description: Aggregate counts across all categories.
      required:
        - visibleIds
        - categoryCounts
        - total
      description: >-
        JSON-safe serialization of the engine's Set/Map-based FilterResult.


        The engine returns FilterResult with Set<string> and Map<string, ...> fields; this interface is what the server
        writes to the wire.
    Fix:
      type: object
      properties:
        message:
          type: string
          description: What this fix does, in words.
        rendered:
          type: string
          description: >-
            The valid marking this fix produces, in the result's output format.


            It is written exactly as the result's own `rendered` is, so the two can be shown side by side. On an
            in-process engine with an `afterRender` plugin, that includes the plugin; the proof reads back the engine's
            own writing from before the plugin ran, so the plugin never decides which fixes are offered.
        keeps:
          type: array
          items:
            $ref: "#/components/schemas/FixConceptReference"
          description: Concepts of the author's marking this fix keeps.
        adds:
          type: array
          items:
            $ref: "#/components/schemas/FixConceptReference"
          description: Concepts this fix adds because an error requires them.
        removes:
          type: array
          items:
            $ref: "#/components/schemas/FixConceptReference"
          description: Concepts of the author's marking this fix removes because an error names them.
      required:
        - message
        - rendered
        - keeps
        - adds
        - removes
      description: >-
        One way to make the marking valid. Every change in it answers an error.


        A fix is a whole marking, not a patch: `rendered` is the complete marking the author would end up with. The
        engine proves each one before offering it: it reads the marking back, judges it the way it judges any input, and
        offers only those that read back valid.
    FixAction:
      type: string
      enum:
        - add
        - remove
        - replace
        - reorder
      description: Discrete mutation represented by an engine `Change`.
    FixConceptReference:
      type: object
      properties:
        conceptId:
          type: string
          description: Concept identifier.
        categoryId:
          type: string
          description: Owning category identifier.
      required:
        - conceptId
        - categoryId
      description: Stable reference to a concept a fix or change touches.
    FormatHeaderAssociation:
      type: object
      properties:
        concept:
          type: string
          description: The concept written as the heading.
        headerCategory:
          type: string
          description: The category the heading concept is asserted in.
        category:
          type: string
          description: The category whose values the heading introduces.
        position:
          $ref: "#/components/schemas/FormatHeaderPosition"
          description: Whether the heading is written before or after the values it heads.
      required:
        - concept
        - headerCategory
        - category
        - position
      description: >-
        A concept that heads the values of another category, resolved to the list it heads.


        A format writes some categories as a named heading followed by the values it introduces. The pairing lives in
        the authored field tree, which stays server-side, so it is resolved here: which concept is the heading, which
        category that concept belongs to, and which category's values it heads. A UI that groups values under their
        heading needs all three; nothing about the grammar that produced them comes with it.
    FormatHeaderPosition:
      type: string
      enum:
        - prefix
        - suffix
      description: Whether a heading is written before or after the values it heads.
    FormatSyntax:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/FormatSyntaxType"
          description: The framing this format writes its text in.
      required:
        - type
      description: >-
        A format's encoding: which framing it uses, and nothing about the settings that framing takes, which are
        authoring content.
    FormatSyntaxType:
      anyOf:
        - type: string
          const: text
          description: Plain text.
        - type: string
          const: xml-attributes
          description: XML attributes on one element.
      description: "How a format's text is framed: plain text or XML attributes on one element."
    FormatView:
      type: object
      properties:
        id:
          type: string
          description: >-
            The output this entry describes, named by callers choosing an output format. For a scheme without
            `render.surfaces` it is a format id, which callers also name as an input format.


            For a scheme with them it is an output address, `surface/view`, and the layout described is the one that
            view's base format writes; a view with cases describes its base format. A view entry's `categoryOrder` and
            per-category maps cover only the categories its surface owns, so two views over one multi-surface format
            describe different category sets. A caller may also name the address as an input format, and
            `RenderConfigDoc.surfaces` says which forms that reads. Recognition reports the view it read the text as in
            `recognition.inputFormat`, the same address. These entries describe views; a view's forms are not entries of
            their own, and `contextFormats` lists them by role.
        surface:
          type: string
          description: >-
            The semantic part of a marking this entry writes, a scheme scope id: the format's surface, or for a scheme
            with `render.surfaces`, the surface this output writes.
        outputView:
          type: string
          description: >-
            The view part of `id`, for a scheme that declares `render.surfaces`. It holds the plain view id, not the
            percent-encoded form `id` carries. Not a concept spelling view; that is `view`. Absent for a scheme whose
            formats are its outputs.
        defaultFor:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingRole"
          description: >-
            For a scheme that declares `render.surfaces`, the roles this view is its surface's default for: the roles a
            marking is written in this view for when a request names none. A surface whose `default` is one view id
            lists both roles on that view. A surface with a default per role lists `whole` on the whole's view and
            `part` on the part's, both on one view when they are the same. Empty on the surface's other views, so a
            picker filling a part field finds the part default on any surface. Absent for a scheme whose formats are its
            outputs, which has one default, `defaultRenderFormat`.
        role:
          $ref: "#/components/schemas/ProcessingRole"
          description: >-
            For a scheme that declares `render.surfaces`, the role of the markings this view is a view of, as the view
            declares it. Text read as this view is a marking of this role. Absent for a view with no role, and for a
            scheme whose formats are its outputs.
        mode:
          $ref: "#/components/schemas/RenderFormatMode"
          description: "Layout: `inline` runs the fields together, `block` puts each on its own line."
        view:
          type: string
          description: Default concept view for fields that do not name one.
        prefix:
          type: string
          description: Written once before the nonempty whole, when it is written unconditionally.
        suffix:
          type: string
          description: Written once after the nonempty whole, when it is written unconditionally.
        separator:
          type: string
          description: What this format writes between two adjacent categories by default.
        categoryOrder:
          type: array
          items:
            type: string
          description: The categories this format writes, in the order it writes them.
        categorySeparators:
          $ref: "#/components/schemas/CategorySeparatorMap"
          description: >-
            What is written between two values of one category, keyed by category id. A category absent from the map
            writes its values with no separator.
        separatorBefore:
          $ref: "#/components/schemas/CategoryLeadingSeparatorMap"
          description: >-
            What is written immediately before a category, keyed by category id, with the format's per-boundary joins
            already applied. The first category in `categoryOrder` has nothing before it and is absent.


            The joins are resolved rather than published raw: a join names the two fields it sits between, and a field
            is a tree node a UI does not have.
        categoryViews:
          $ref: "#/components/schemas/CategoryViewMap"
          description: >-
            The concept view a category is written in, keyed by category id, where it differs from the format's own
            `view`.


            A field may write in a view of its own, which is how one format writes a control in its short spelling
            beside a level in its spelled-out one. A category absent from the map is written in the format's view.
        categoryTiers:
          $ref: "#/components/schemas/CategoryTierMap"
          description: >-
            How a category's tiered concepts compose into one token, keyed by category id, outermost tier first.


            A concept of a lower tier does not stand beside the one it belongs to; it attaches to it, and what goes
            between them is the attachment rather than the category's own separator. A category absent from the map
            writes its values as plain values.


            The resolved `TierComposition` the scheme model already carries, not a second shape saying the same thing:
            what a surface needs here is what a field was authored with, and one representation is what keeps the two
            answers from drifting.
        categoryEach:
          $ref: "#/components/schemas/CategoryEachAffixMap"
          description: >-
            What is written around every single value of a category, keyed by category id, as opposed to once around all
            of them.


            A category whose values each carry a marker of their own is written by a field that declares `each`, and the
            marker belongs to the value rather than to the list: a surface placing three values with a separator between
            them writes the affix three times and the separator twice. A category absent from the map writes its values
            bare.


            Unconditional by construction. Unlike the format's own `prefix` and `suffix`, which are parts that may each
            sit behind a condition and are published only where they do not, `each` is two plain strings with nowhere
            for a condition to be written, so nothing here is left out.
        headers:
          type: array
          items:
            $ref: "#/components/schemas/FormatHeaderAssociation"
          description: Headings this format writes, paired with the lists they head.
        syntax:
          $ref: "#/components/schemas/FormatSyntax"
          description: Encoding. Absent means plain text.
      required:
        - categoryOrder
        - id
        - mode
        - surface
      description: >-
        A format as the server describes it: what it writes and how it lays a marking out, not how it is built.


        A format's field tree is authoring content. It stays server-side, because the operations that need it
        (recognition, rendering, repair) are server operations, and a client that held the tree would be holding a
        second implementation of them. What a client legitimately needs is enough to name a format in a request, to
        label it in a picker, and to place a marking's parts itself: the resolved layout `RenderFormatLayout` describes,
        plus how the text is framed.


        The same shape whether a local engine or a remote client answers.
    GuideBreakdownEntry:
