# EzClassify REST API contract (OpenAPI 3.1). Generated file, do not edit directly.
# Canonical source: the ezclassify/contracts repository. Routes are declared in
# libs/openapi/src/route-decls/ and component schemas are generated from the wire
# and definition types this repository publishes.
# Regenerate:  npm run codegen
# Every other copy of this file is a downstream mirror, and edits made to a
# mirror are overwritten by the next sync from the generator.
openapi: 3.1.0
info:
  title: EzClassify REST API
  version: 1.0.0-dev.30
  description: |
    Context-bound API for processing, validating, aggregating, and scanning
    markings, checking access, and translating between schemes. A Context
    composes versioned schemes, layers, guides, access policies, and crosswalks.

    A deployment that requires authentication answers an unauthenticated
    request with the same not-found shape a missing resource gets. A 404 is
    therefore not proof that a route or a resource is absent, and no operation
    declares a 401 or a 403 because the server never sends one.

    The two kinds of 404 body are deliberately different. A refused request
    gets the constant body {"error": "not_found"} with no code and no detail,
    because telling a refusal apart from an absence is exactly what that
    shape exists to prevent; it is a security property and it will not gain
    fields. A request that did reach routing and matched no route gets the
    ordinary error body carrying code "route_not_found". Clients classify on
    the code: the message is prose and will change, and the constant refusal
    body offers no code to classify on.

    Requests are closed. A query parameter an operation does not declare, or
    a body field its request schema does not declare, is refused with a 400
    carrying code "INVALID_INPUT" and a detail naming it, never ignored.
  contact:
    name: EzClassify Support
    email: support@ezclassify.com
    url: https://ezclassify.com
  license:
    name: EzClassify Runtime License
    url: https://ezclassify.com/legal/runtime-license
servers:
  - url: https://{host}
    description: An EzClassify runtime deployment. Set host to the deployment you were given.
    variables:
      host:
        default: api.ezclassify.example
        description: Hostname of the runtime deployment serving this contract.
  - url: http://api.ezclassify.test
    description: Local development
security:
  - bearerAuth: []
    contextToken: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns service liveness status and the engine version string.
      tags:
        - infrastructure
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                engineVersion: 1.0.0
                engineSha: 05159342c80cc5fb2506fc7adf3c511f6b3af4d9
                gitTag: v1.0.0
                openapiVersion: 1.0.0
                abiVersion: v1
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/ready:
    get:
      operationId: getReady
      summary: Readiness check
      description: >-
        Reports whether the shared runtime host admitted the configured license and all explicitly required local
        artifacts are available. Expiration never makes a replica unready.
      tags:
        - infrastructure
      security: []
      responses:
        "200":
          description: Replica is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ready
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NotReady"
          description: Runtime host is starting or required local artifacts are unavailable
  /v1/ctx:
    get:
      operationId: ctxList
      summary: List the context ids the caller may use
      description: >-
        Lists the installed context ids the caller may use. On a managed deployment, a Context token lists the one
        context it names, and an API-key caller without a token lists the contexts the deployment approves for its
        organization, when the deployment accepts API keys. A standalone runtime takes no Context token: installation is
        the grant, and it lists every installed context it can serve now, leaving out one whose latest version does not
        resolve or whose content the license does not cover. The list is unpaginated. On a managed deployment, returns
        404 when authorization is denied.
      tags:
        - context
      responses:
        "200":
          description: List of context ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtxListResponseBody"
              example:
                contexts:
                  - corp-default
                  - corp-restricted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}:
    get:
      operationId: ctxVersions
      summary: List available versions for a context id
      description: >-
        Lists every installed version of one context id that the caller may use, highest semver first. On a managed
        deployment, these are the versions its Context token or API key admits. A standalone runtime takes no Context
        token: installation is the grant, and it lists every installed version it can serve, leaving out one whose
        content the license does not cover. Returns 404 when the id is not installed or authorization is denied.
      tags:
        - context
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available versions for the context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtxVersionsResponseBody"
              example:
                id: corp-default
                versions:
                  - 2.0.0
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}:
    get:
      operationId: ctxDescribe
      summary: Describe a resolved context
      description: >-
        Returns the component breakdown for the resolved context: scheme, ordered layers, ordered guides, optional
        access policy, and ordered crosswalks, each with the version it declares and the concrete version that answered.
        The :version segment may be a concrete semver or the literal "latest"; the resolved version is reported in the
        X-EzClassify-Resolved-Version response header and echoed in the response body.
      tags:
        - context
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. Without this segment the URL lists the context's versions instead.
          schema:
            type: string
      responses:
        "200":
          description: Resolved context decomposition
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtxDescribeResponseBody"
              example:
                id: corp-default
                version: 2.0.0
                description: Default corporate marking context
                scheme:
                  id: base-scheme
                  version: 1.0.0
                  resolvedVersion: 1.0.0
                  layers:
                    - id: corp-ext
                      version: latest
                      resolvedVersion: 1.2.0
                guides:
                  - id: corp-guide
                    version: latest
                    resolvedVersion: 3.0.0
                access:
                  id: corp-access
                  version: latest
                  resolvedVersion: 1.0.0
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/document/audit:
    post:
      operationId: ctxDocumentAudit
      summary: Audit a document for marking coverage in a context
      description: >-
        Audits authored document markings and evaluates guide nominations without treating lexical matches as
        authoritative facts. Never accept a nomination without an explicit analyst decision bound to its finding ID and
        document digest; revised text requires new decisions. Determined results include only accepted findings and
        manual selections, while projected results assume unresolved nominations and remain advisory. This operation
        answers authored correctness and guide review; document access assessment (POST
        /v1/ctx/{ctxId}/{version}/document/assess-access) answers whether supplied userAttributes satisfy the document
        policy. The standard response profile is the default; summary suits only an initial large-document overview,
        standard is needed before analyst decisions or remediation, and full only when matched text or complete
        breakdowns are necessary. responseProjection counts and omittedFields state what the profile left out; omitted
        detail is not absent evidence.
      tags:
        - context
        - document
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtxDocumentAuditRequestBody"
            example:
              text: Document body text here.
              guideDeterminations:
                findings: []
                manualSelections: []
              responseProfile: standard
      responses:
        "200":
          description: Resolved Context document audit result
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDocumentAuditResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: A supplied finding determination or manual selection is stale.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/document/assess-access:
    post:
      operationId: ctxDocumentAssessAccess
      summary: Assess document access in a context
      description: >-
        Answers whether the supplied userAttributes satisfy a document under the Context policy. It audits the document
        once and evaluates authored, authoritative, and projected access scenarios against immutable userAttributes and
        Context policy. Lexical matches are nominations, never automatic decisions; accepted findings bind to the
        returned finding ID and document digest, and revised text requires new decisions. Authoritative includes
        authored facts plus explicit analyst decisions. Projected assumes unresolved nominations and remains advisory.
        contentRequirements identify supported content that must cease to apply after content change and re-evaluation;
        they are not instructions to lower a marking. contextRequirements are conditional future relationships between
        userAttributes and authoritative context, not mutations performed by EzClassify. A denial remains denied until
        revised text or authoritative external state is re-evaluated. The standard profile is the default; summary suits
        only an initial large-document overview, standard is needed before decisions or remediation, and full only when
        matched text or complete breakdowns are necessary. responseProjection counts and omittedFields state what the
        profile left out; omitted detail is not absent evidence.
      tags:
        - context
        - document
        - access
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtxDocumentAssessAccessRequestBody"
            example:
              text: Document body text here.
              userAttributes:
                clearance: high
              context:
                distribution:
                  - team-a
              guideDeterminations:
                findings: []
                manualSelections: []
              responseProfile: standard
      responses:
        "200":
          description: Resolved Context document access assessment
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDocumentAccessAssessmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: A supplied finding determination or manual selection is stale.
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
          description: Context has no access policy attached.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme:
    get:
      operationId: ctxSchemeSummary
      summary: Get the scheme summary in a context
      description: >-
        Returns high-level metadata for the context's composed scheme (base plus its declared layers): id, version,
        name, description, presentation configuration, default render format, and scope label. The scheme identity and
        layers come from the Context. The :version segment may be omitted to default to "latest"; the resolved version
        is returned in the X-EzClassify-Resolved-Version response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
        - name: scheme
          in: query
          required: false
          description: >-
            Context-local key, or unambiguous artifact id, of the scheme to read. Defaults to the context's primary
            scheme; a crosswalk's source or target scheme is named here. A key the context does not hold answers 404.
          schema:
            type: string
      responses:
        "200":
          description: Scheme summary
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemeSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/concepts:
    get:
      operationId: ctxSchemeConcepts
      summary: Get the scheme concepts in a context
      description: >-
        Returns every concept of the context's composed scheme as a concept view: id, name, views, categories, parents,
        position, rank, and display metadata, the same shape a local engine's scheme view carries. The :version segment
        may be omitted to default to "latest"; the resolved version is returned in the X-EzClassify-Resolved-Version
        response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
        - name: scheme
          in: query
          required: false
          description: >-
            Context-local key, or unambiguous artifact id, of the scheme to read. Defaults to the context's primary
            scheme; a crosswalk's source or target scheme is named here. A key the context does not hold answers 404.
          schema:
            type: string
      responses:
        "200":
          description: Concept list
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConceptView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/categories:
    get:
      operationId: ctxSchemeCategories
      summary: Get the scheme categories in a context
      description: >-
        Returns every category of the context's composed scheme as a category view, in declared order: label, scopes,
        default concept, rollup, and concept sort order, the same shape a local engine's scheme view carries. The
        :version segment may be omitted to default to "latest"; the resolved version is returned in the
        X-EzClassify-Resolved-Version response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
        - name: scheme
          in: query
          required: false
          description: >-
            Context-local key, or unambiguous artifact id, of the scheme to read. Defaults to the context's primary
            scheme; a crosswalk's source or target scheme is named here. A key the context does not hold answers 404.
          schema:
            type: string
      responses:
        "200":
          description: Category list
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/formats:
    get:
      operationId: ctxSchemeFormats
      summary: Get the scheme render formats in a context
      description: >-
        Lists the formats the context's composed scheme writes as format views: each format's id, the surface it writes,
        its resolved layout, and how its text is framed, the same shape a local engine's scheme view carries. Not the
        field trees, which stay server-side. The :version segment may be omitted to default to "latest"; the resolved
        version is returned in the X-EzClassify-Resolved-Version response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
        - name: scheme
          in: query
          required: false
          description: >-
            Context-local key, or unambiguous artifact id, of the scheme to read. Defaults to the context's primary
            scheme; a crosswalk's source or target scheme is named here. A key the context does not hold answers 404.
          schema:
            type: string
      responses:
        "200":
          description: Render format list
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormatView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/grammar:
    get:
      operationId: ctxSchemeGrammar
      summary: Get the scheme parse grammar in a context
      description: >-
        Returns the parse grammar for the context's composed scheme: whether its vocabulary is matched case-sensitively
        and whether surrounding whitespace is ignored. There is no separator; each field of a marking writes its own
        boundaries. The :version segment may be omitted to default to "latest"; the resolved version is returned in the
        X-EzClassify-Resolved-Version response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
        - name: scheme
          in: query
          required: false
          description: >-
            Context-local key, or unambiguous artifact id, of the scheme to read. Defaults to the context's primary
            scheme; a crosswalk's source or target scheme is named here. A key the context does not hold answers 404.
          schema:
            type: string
      responses:
        "200":
          description: Parse grammar
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemeGrammar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/scopes:
    get:
      operationId: ctxSchemeScopes
      summary: Get the scheme scopes in a context
      description: >-
        Returns the scope definitions for the context's composed scheme in declaration order. Empty when it declares
        none. The :version segment may be omitted to default to "latest"; the resolved version is returned in the
        X-EzClassify-Resolved-Version response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
        - name: scheme
          in: query
          required: false
          description: >-
            Context-local key, or unambiguous artifact id, of the scheme to read. Defaults to the context's primary
            scheme; a crosswalk's source or target scheme is named here. A key the context does not hold answers 404.
          schema:
            type: string
      responses:
        "200":
          description: Scope definitions, empty when none are declared
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemeScopesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/label-presets:
    get:
      operationId: ctxSchemeLabelPresets
      summary: List the label presets in a context
      description: >-
        Returns the label presets of the context's primary scheme, the scheme apply-preset expands them in, as preset
        views: id, label, description, and scope. Empty when the scheme declares none. The marking string and tag list
        stay server-side; expand a preset with POST /v1/ctx/{ctxId}/{version}/scheme/apply-preset. The :version segment
        may be omitted to default to "latest"; the resolved version is returned in the X-EzClassify-Resolved-Version
        response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
      responses:
        "200":
          description: Label preset list
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LabelPresetView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/apply-preset:
    post:
      operationId: ctxSchemeApplyPreset
      summary: Apply a label preset in a context
      description: >-
        Expands the named label preset against the context's composed scheme and returns what validate answers for the
        marking it stands for, in the standard context operation envelope every other context operation answers with. A
        preset is a stored marking, so the answer carries no fix paths or corrections. The label-presets resource keeps
        each preset's marking string server-side, so this is the only way to order one of its items. Returns 404 when
        the scheme declares no preset by that id. The :version segment may be omitted to default to "latest"; the
        resolved version is returned in the X-EzClassify-Resolved-Version response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
