          const: mapping
          description: A per-assertion mapping prohibited the translation.
        mappingId:
          type: string
          description: Stable mapping id.
        source:
          $ref: "#/components/schemas/AssertionReference"
          description: Source assertion that matched the mapping.
        reason:
          type: string
          description: Human-readable basis for the prohibition.
        authority:
          type: string
          description: Authority copied from the mapping, when declared.
        guidance:
          type: string
          description: Operator guidance copied from the mapping, when declared.
        citation:
