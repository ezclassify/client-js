        projectedWholeCoverage:
          anyOf:
            - $ref: "#/components/schemas/CheckCoverageResult"
            - type: "null"
          description: Authored whole coverage of the projected requirement.
      required:
        - status
        - nominationCount
        - unresolvedCount
        - acceptedCount
        - rejectedCount
        - evidenceSpanCount
        - unitCoverage
        - determinedRequiredWhole
        - projectedRequiredWhole
        - determinedWholeCoverage
