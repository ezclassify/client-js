    CrosswalkCompletedTranslationResult:
      type: object
      properties:
        crosswalk:
          $ref: "#/components/schemas/ArtifactReference"
          description: Crosswalk artifact used for the operation.
        sourceScheme:
          $ref: "#/components/schemas/ArtifactReference"
          description: Source scheme artifact.
        targetScheme:
          $ref: "#/components/schemas/ArtifactReference"
          description: Target scheme artifact.
        source:
          $ref: "#/components/schemas/ValidateResult"
          description: >-
            What validate answers for the source marking: its facts, whether it stands, and how it was read. A
            translation reads the source; it does not correct it, so the answer carries no fix paths.
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkOutcome"
          description: Ordered treatment of every source assertion.
        selections:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkSelectionOutcome"
          description: Cross-field candidate chosen for every declared selection.
        target:
          $ref: "#/components/schemas/ValidateResult"
          description: >-
            What validate answers for the target marking, built only from the carried assertions. Nothing was read, so
            it has no `recognition`.
        status:
          $ref: "#/components/schemas/CrosswalkCompletedTranslationStatus"
          description: Completion state after source and target processing.
      required:
        - crosswalk
        - outcomes
        - selections
        - source
        - sourceScheme
        - status
        - target
        - targetScheme
      description: Translation that reached target-scheme processing.
    CrosswalkCompletedTranslationStatus:
      type: string
      enum:
        - complete
        - partial
        - invalid-source
      description: Completion state of a crosswalk that reached target-scheme processing.
    CrosswalkDisposition:
      type: string
      enum:
        - carry
        - review
        - omit
        - forbid
      description: Decision a reviewed crosswalk makes for one source assertion.
    CrosswalkForbidMatch:
      anyOf:
        - $ref: "#/components/schemas/CrosswalkMappingForbidMatch"
        - $ref: "#/components/schemas/CrosswalkSelectionForbidMatch"
      description: >-
        A matched prohibition that aborted a crosswalk translation.


        Both branches are named types rather than anonymous object literals because the wire mirrors this union, and a
        generated SDK needs a name for each side.
    CrosswalkForbiddenTranslationResult:
      type: object
      properties:
        crosswalk:
          $ref: "#/components/schemas/ArtifactReference"
          description: Crosswalk artifact used for the operation.
        sourceScheme:
          $ref: "#/components/schemas/ArtifactReference"
          description: Source scheme artifact.
        targetScheme:
          $ref: "#/components/schemas/ArtifactReference"
          description: Target scheme artifact.
        source:
          $ref: "#/components/schemas/ValidateResult"
          description: >-
            What validate answers for the source marking: its facts, whether it stands, and how it was read. A
            translation reads the source; it does not correct it, so the answer carries no fix paths.
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkOutcome"
          description: Ordered treatment of every source assertion.
        selections:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkSelectionOutcome"
          description: Cross-field candidate chosen for every declared selection.
        forbiddenBy:
          type: array
          items:
            $ref: "#/components/schemas/CrosswalkForbidMatch"
          description: Every matched prohibition, in deterministic evaluation order.
        status:
          type: string
          const: forbidden
          description: Terminal hard-stop state.
      required:
        - crosswalk
        - forbiddenBy
        - outcomes
        - selections
        - source
        - sourceScheme
        - status
        - targetScheme
      description: Translation aborted before target processing by one or more prohibitions.
