        "422":
          $ref: "#/components/responses/UnprocessableEntity"
          description: Context has no crosswalks attached.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    AccessComparisonResult:
      type: object
      properties:
        left:
          $ref: "#/components/schemas/AccessOperand"
          description: Left comparison operand.
        operator:
          type: string
          description: Policy operator applied to the operands.
        right:
          $ref: "#/components/schemas/AccessOperand"
          description: Right comparison operand.
        matched:
          type: boolean
          description: Whether the comparison succeeded.
        missing:
          type: array
          items: {}
          description: Required values missing from the evaluated operand, when applicable.
      required:
        - left
        - operator
        - right
        - matched
      description: Machine-readable result of one access-rule comparison.
    AccessDecision:
      type: object
      properties:
        granted:
          type: boolean
          description: True when every rule that was not skipped granted access.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AccessRuleResult"
          description: One result per rule in the policy, in policy order.
        provenance:
          $ref: "#/components/schemas/SourceReference"
          description: >-
            Source provenance for the access-rule source that evaluated this decision.


            Populated only when the `AccessEngine` was wired with an external `AccessRuleSource` override at load time
            (typically a `MappedAccessRuleSource` the server's Context loader built from an access YAML's
            `rules.external` block). Inline-backed decisions leave this field undefined to keep payloads compact for the
            common single-source case.


            Identity fields mirror the source's `sourceIdentity()` observation at engine-construction time.
      required:
        - granted
        - rules
      description: >-
        Overall access decision with per-rule breakdown.


        Returned by `AccessEngineAdapter.check()`. `granted` is `true` only when every non-skipped rule granted access.
        Inspect `rules` to surface per-category denial reasons in an authorization UI: each `AccessRuleResult` carries a
        human-readable `reason` field.
    AccessOperand:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/AccessOperandSource"
          description: Source domain from which the value was read.
        path:
          type: string
          description: Dot-path for subject or context operands.
        categoryId:
          type: string
          description: Category addressed by an assertion operand.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/AssertionReference"
          description: Assertions addressed by an assertion operand.
        value:
          description: Literal or resolved opaque value.
      required:
        - source
      description: Typed operand captured while an access rule is evaluated.
    AccessOperandSource:
      type: string
      enum:
        - subject
        - context
        - assertion
        - literal
      description: Source of one operand in an access-policy comparison.
    AccessRequirementsDescription:
      type: object
      properties:
        marking:
          type: string
          description: Normalized marking when the caller supplied or derived one.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            Normalized effective target assertions, listed in print order: the order `marking` places each concept; a
            concept it leaves out appears where it would print.
        assertionDisplays:
          type: array
          items:
            type: string
          description: >-
            Resolved operational display (rendered marking view) for each entry in `assertions`, index-aligned. A
            consumer that instantiates `requirementText` against the target assertions substitutes this rather than the
            raw concept id, so the requirement renders the concept's marking token instead of its internal id.
            `assertions` keeps the machine `conceptId` keys.
        access:
          $ref: "#/components/schemas/ArtifactReference"
          description: Access artifact whose policy was described.
        scheme:
          $ref: "#/components/schemas/ArtifactReference"
          description: Scheme artifact used to normalize the target.
        appliedRules:
          type: array
          items:
            $ref: "#/components/schemas/RuleReference"
          description: Qualified rules activated by the trusted target.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AccessRuleDescription"
          description: Per-rule immutable-policy descriptions.
        combinedRequirementText:
          type: string
          description: Combined human-readable requirement expression.
        combinedAttributesNeeded:
          type: array
          items:
            type: string
          description: Union of subject and context paths needed to evaluate the target.
        lines:
          type: array
          items:
            type: string
          description: Line-oriented rendering of the combined description.
      required:
        - assertions
        - assertionDisplays
        - access
        - scheme
        - appliedRules
        - rules
        - combinedRequirementText
        - combinedAttributesNeeded
        - lines
      description: Aggregated immutable-policy requirements for a trusted target.
    AccessRuleActivation:
      type: object
      properties:
        matched:
          type: boolean
          description: Whether the rule's activation predicate matched.
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/AssertionReference"
          description: Assertions that activated the rule.
        contextPaths:
          type: array
          items:
            type: string
          description: Context paths consulted by activation.
      required:
        - matched
        - assertions
        - contextPaths
      description: Machine-readable record of why an access rule activated.
    AccessRuleDescription:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/RuleReference"
          description: Qualified rule being described.
        access:
          $ref: "#/components/schemas/ArtifactReference"
          description: Access artifact that owns the rule.
        scheme:
          $ref: "#/components/schemas/ArtifactReference"
          description: Scheme artifact whose assertions the rule evaluates.
        name:
          type: string
          description: Human-readable rule name.
        description:
          type: string
          description: Optional policy-authored description.
        requirementText:
          type: string
          description: Human-readable requirement expression.
        whenText:
          type: string
          description: Human-readable activation expression.
        attributesNeeded:
          type: array
          items:
            type: string
          description: Subject or context paths required to evaluate the rule.
        dependsOn:
          type: array
          items:
            $ref: "#/components/schemas/RuleReference"
          description: Qualified rules this rule depends on.
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/RuleReference"
          description: Qualified rules this rule overrides.
        lines:
          type: array
          items:
            type: string
          description: Line-oriented rendering of the description.
      required:
        - rule
        - access
        - scheme
        - name
        - requirementText
        - attributesNeeded
        - dependsOn
        - overrides
        - lines
      description: >-
        Human-readable description of a single access rule.


        Returned by `AccessEngineAdapter.describeAccessRule`. Tooling (LLM agents, UI tooltips) can render
        `requirementText` directly or walk `attributesNeeded` to know which `userAttributes` values a caller has to
        provide.
    AccessRuleResult:
      type: object
      properties:
        ruleIndex:
          type: integer
          description: Zero-based index of the rule in the access policy's evaluated rules.
        name:
          type: string
          description: Rule name from the access policy (for display).
        granted:
          type: boolean
          description: Whether this rule passed.
        skipped:
          type: boolean
          description: Whether the rule was skipped because its activation did not match.
        reason:
          type: string
          description: Denial reason from the rule definition or generated explanation.
        activation:
          $ref: "#/components/schemas/AccessRuleActivation"
          description: Machine-readable activation basis.
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/AccessComparisonResult"
          description: Machine-readable comparisons evaluated by the rule.
        rule:
          $ref: "#/components/schemas/RuleReference"
          description: Qualified rule identity and semantic digest.
        modernizedFrom:
          type: array
          items:
            $ref: "#/components/schemas/ConceptModernization"
          description: >-
            Deprecated-to-current concept substitutions that processing applied to the data before this rule was
            evaluated.


            Present only when the data carried a deprecated concept. It completes the explanation of the decision: the
            marking the document bears, the current concept it resolved to, and the comparison this rule actually made.
            A consumer showing why access was granted or denied should surface it, so the verdict is never reported
            against a concept the reader never saw.
      required:
        - ruleIndex
        - name
        - granted
        - skipped
        - activation
        - comparisons
        - rule
      description: Result of evaluating a single qualified access rule entry.
    AccessScenarioAssessment:
      type: object
      properties:
        basis:
          $ref: "#/components/schemas/AccessScenarioBasis"
          description: Authority basis of this scenario.
        advisory:
          type: boolean
          description: Whether the scenario is advisory rather than authoritative.
        status:
          $ref: "#/components/schemas/AccessScenarioStatus"
          description: Closed evaluation status.
        target:
          anyOf:
            - $ref: "#/components/schemas/EffectiveDocumentTarget"
            - type: "null"
          description: Effective target, or null when none can be derived.
        decision:
          $ref: "#/components/schemas/AccessDecision"
          description: Access decision, omitted for summary and not-evaluated scenarios.
        contentRequirements:
          type: array
          items:
            $ref: "#/components/schemas/ContentChangeRequirement"
          description: Traceable document-side requirements, omitted by summary.
        contextRequirements:
          type: array
          items:
            $ref: "#/components/schemas/SubjectContextRequirement"
          description: Conditional relationship requirements, omitted by summary.
        limitations:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentLimitation"
          description: Scenario-specific limitations.
      required:
        - basis
        - advisory
        - status
        - target
        - limitations
      description: Access result for one authored, authoritative, or projected target.
    AccessScenarioBasis:
      type: string
      enum:
        - authored
        - authoritative
        - projected
      description: Authority basis used to construct an access scenario.
    AccessScenarioStatus:
      type: string
      enum:
        - granted
        - denied
        - not-evaluated
      description: Closed evaluation status of an access scenario.
    AggregateResult:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            The assertions of the combined marking, listed in print order as a validate result's are: the order the
            rendered marking places each concept; a concept the rendering leaves out appears where it would print.
        rendered:
          type: string
          description: The combined marking, written in the output format.
        displayColor:
          $ref: "#/components/schemas/ConceptColor"
          description: >-
            Portable scheme-derived display color for the final post-rollup marking. Embedding hosts may override this
            presentation default.
        valid:
          type: boolean
          description: True when the combined marking stands once settled, as `ValidateResult.valid` defines it.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
          description: The constraints the combined marking violates.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
          description: Advisory signals about the combined marking.
        appliedFixes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          description: The changes the rollup made to reach the combined marking.
        proposedFixes:
          type: array
          items:
            $ref: "#/components/schemas/Fix"
          description: "Always empty: aggregate applies every fix it can."
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
          description: >-
            The notices the scheme attaches to the concepts in `assertions`, collected the same way
            `SchemeEngine.collectNotices()` collects them. Always present, empty when the aggregate carries none, so a
            consumer can read the field without checking that it exists.
      required:
        - assertions
        - rendered
        - valid
        - errors
        - warnings
        - appliedFixes
        - proposedFixes
        - notices
      description: >-
        Output of SchemeEngine.aggregate(): the combined marking produced from multiple portion inputs. By design
        aggregate always produces the proper aggregate: fixes are applied, never proposed. Every field it shares with
        `ValidateResult` means what it means there, `valid` included. It differs in that:


        - There is no `inputWasValid` (input is N portions, not a single string)

        - `proposedFixes` is always empty (aggregate applies what it can)
    AggregatedMarkings:
      type: object
      additionalProperties:
        type: string
      description: "Aggregated guide output: one rolled-up marking per target scheme id."
    ApplyPresetRequest:
      type: object
      properties:
        presetId:
          type: string
          description: ID of the label preset to expand.
        outputFormat:
          type: string
          description: >-
            The format the expanded marking is rendered in. Omitted or empty, the scheme's default format. For a scheme
            that declares `render.surfaces`, an output as the scheme document's `render.surfaces` defines it.
      required:
        - presetId
      additionalProperties: false
      description: Context scheme apply-preset request.
    ArtifactKind:
      type: string
      enum:
        - scheme
        - layer
        - guide
        - access
        - crosswalk
        - context
      description: Closed artifact families participating in a composed operation.
    ArtifactReference:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ArtifactKind"
          description: Artifact family.
        id:
          type: string
          description: Artifact identifier.
        version:
          type: string
          description: Resolved immutable artifact version.
        digest:
          type: string
          description: Content digest when the resolver can supply one.
      required:
        - kind
        - id
        - version
      description: Identifies an immutable artifact participating in a composed operation.
    Assertion:
      type: object
      properties:
        conceptId:
          type: string
          description: The id of the concept.
        categoryId:
          type: string
          description: The id of the category the concept is asserted in.
        confidence:
          $ref: "#/components/schemas/AssertionConfidence"
          description: >-
            How the assertion was produced: `certain` when read or handed in as stated, `inferred` when an inference
            rule added it, or `repaired` when the engine added or rewrote it while repairing the marking. The engine
            does not assign `uncertain` itself.
        source:
          type: string
          description: >-
            Where this assertion came from. An open string: the engine labels the facts it adds, and a caller or a host
            may label the facts it hands in however it likes.


            Four labels mean the engine derived the fact, so it derives the fact again each time it settles a marking:
            `infer`, and `repair` with a `sourceRule`, a fact a scheme rule adds; `default`, a category's default
            concept; and `context`, a value a part took from its whole. When validate, process or explain settles a
            marking, a fact handed in under one of them is set aside and comes back only if the engine derives it again,
            so no label can make a removal silent.


            Every other label is the author's statement and is kept as given: `parse` (read from text), `user` (handed
            in by a caller), `aggregate` (a value a rollup states as its own, even one a contributor derived or took
            from its whole), every other label the engine writes on a result, and any label a caller or host chooses,
            such as `stated`.
        sourceRule:
          type: string
          description: >-
            The id of the scheme rule that produced this assertion, when one did. Otherwise an engine-owned id beginning
            with `_`, set when the scheme's structure, not a rule, added the assertion. The engine writes two:
            `_tier_child_requires_parent` (a tier parent required by a stated child) and `_header_of_stated_member` (a
            header filled in for a stated member). A scheme rule id never begins with `_`.
        expiresAt:
          type: string
          description: Caller-supplied ISO 8601 expiry date; the engine does not evaluate it.
        value:
          type: string
          description: >-
            The value of a concept that takes one (`text_input`).


            A value handed in is read the way a value in text is: it settles in the spelling the concept's encoding
            stores. One the encoding cannot read is reported as the error `_invalid_assertion_value`, and a concept that
            takes a value, handed in with none, as `_missing_assertion_value`. See `ValidationError`.
        metadata:
          type: object
          additionalProperties: {}
          description: Caller-defined data attached to the assertion. The engine assigns it no meaning.
        replacedConceptId:
          type: string
          description: >-
            The deprecated concept this assertion was modernized from.


            Set when processing rewrote a deprecated concept into the replacement its scheme declares. `conceptId` is
            the current concept every downstream stage evaluates; this field records what the data was actually marked
            with, so an explanation can show the substitution ("concept A was replaced by concept B; B is what your
            access was compared against") instead of silently presenting a concept the document never carried.


            It travels on the assertion rather than alongside it because assertion arrays are the engine's state
            transport: an access check made from transported assertions can still explain the substitution.
        provenance:
          $ref: "#/components/schemas/SourceReference"
          description: >-
            Source provenance for the concept that backed this assertion.


            Populated only when the concept came from an external source whose records were loaded with the scheme
            (typically one a scheme's `concepts.external` block declares). Inline-backed assertions leave this field
            undefined to keep payloads compact for the common single-source case. A concept a scheme document declares
            in its `inline` list has none, even when one of that document's `external` sources also serves a record with
            its id. A concept read through a queryable-only source (`SourceCapabilities.queryableOnly`) has none either:
            that source is asked per lookup and never loaded whole, and a lookup does not say which source answered.
            Such a source still appears in a composed operation's `resolution.sources`. Across a layered stack the later
            layer decides: a concept a later layer's source supplies carries that source's provenance even when an
            earlier document declares it inline, and a concept a later layer declares inline carries none.


            Identity fields mirror the source's `sourceIdentity()` observation at engine-load time (or the immutable
            value the Context pinned).
      required:
        - categoryId
        - conceptId
        - confidence
        - source
      description: >-
        A concept asserted in a category during processing, with confidence level and provenance metadata.


        Assertions are the core data unit flowing through the engine pipeline. `confidence` records how the assertion
        was produced: `'certain'` when read or handed in as stated, `'inferred'` when an inference rule added it, and
        `'repaired'` when the engine added or rewrote it while repairing the marking. The engine does not assign
        `'uncertain'` itself. `source` says where the assertion came from. `expiresAt` records caller-supplied expiry
        metadata. The engine does not evaluate that date or automatically change confidence or the marking; the host
        applies its expiry policy.
    AssertionConfidence:
      type: string
      enum:
        - certain
        - inferred
        - repaired
        - uncertain
      description: Confidence assigned to an assertion by the processing pipeline.
    AssertionRef:
      type: object
      properties:
        conceptId:
          type: string
          description: The concept asserted.
        categoryId:
          type: string
          description: The category it was asserted in.
        value:
          type: string
          description: Its value, for a concept that carries free text.
      required:
        - conceptId
        - categoryId
      description: A reference to one assertion of the state being rendered.
    AssertionReference:
      type: object
      properties:
        categoryId:
          type: string
          description: Category containing the asserted concept.
        conceptId:
          type: string
          description: Asserted concept identifier.
        value:
          type: string
          description: Captured value for value-bearing concepts.
      required:
        - categoryId
        - conceptId
      description: Compact reference to an assertion without engine-production metadata.
    AssertionSupport:
      type: object
      properties:
        supportId:
          type: string
          description: Content-derived stable support identifier.
        assertion:
          $ref: "#/components/schemas/AssertionReference"
          description: Assertion supported by the cited facts and rules.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleReference"
          description: Direct and computed rules contributing to the assertion.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContentEvidenceSpan"
          description: Canonically ordered evidence for the assertion.
        factReferences:
          type: array
          items:
            $ref: "#/components/schemas/GuideFactReference"
          description: Human-decision or projected facts supplying the assertion.
      required:
        - supportId
        - assertion
        - rules
        - evidence
        - factReferences
      description: De-duplicated content lineage for one compiled assertion.
    AssessmentLimitation:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable limitation code.
        scope:
          type: string
          description: Optional operation scope affected by the limitation.
        reason:
          type: string
          description: Human-readable explanation safe for the selected response profile.
      required:
        - code
        - reason
      description: Explains why an assessment dimension or conclusion is constrained.
    Attribution:
      type: object
      properties:
        name:
          type: string
          description: Display name of the upstream source (e.g. "NIST CSWP-29").
        license:
          type: string
          description: SPDX identifier or short license token (e.g. "CC-BY-4.0", "public-domain").
        licenseUrl:
          type: string
          description: Canonical URL where the license terms can be inspected.
        citation:
          type: string
          description: Suggested citation string for academic / regulatory use.
      required:
        - name
        - license
      description: >-
        Provenance attached to every source so downstream consumers can render proper attribution and license notices.


        Mandatory because most source data we'll integrate (NIST, ICS, IANA, external taxonomies) requires citation.
        Sources that don't have a formal license should set `license: 'unspecified'` rather than omit it.
    BestEffortRuleSourceReference:
      type: object
      properties:
        providerId:
          type: string
          description: Stable identifier for the source provider.
        reproducibility:
          type: string
          const: best-effort
          description: Whether the source observation can be reproduced byte-for-byte.
      required:
        - providerId
        - reproducibility
      description: Best-effort external source join carried by a qualified rule reference.
    BestEffortSourceReference:
      type: object
      properties:
        reproducibility:
          type: string
          const: best-effort
          description: Whether the source observation can be reproduced byte-for-byte.
        locator:
          type: string
          description: Location from which the mutable content was observed.
        providerId:
          type: string
          description: Stable identifier for the source provider.
        attribution:
          $ref: "#/components/schemas/Attribution"
          description: Attribution and license information for the observed source.
      required:
        - attribution
        - providerId
        - reproducibility
      description: Best-effort source identity and mandatory attribution for an operation.
    CalendarDateSpelling:
      type: string
      enum:
        - YYYYMMDD
        - YYYY-MM-DD
      description: >-
        One spelling of a calendar date. The canonical spelling is the one a value is stored in; the others are read on
        input and written per view.
    CalendarDateValueEncoding:
      type: object
      properties:
        type:
          type: string
          const: calendar-date
          description: "A calendar date: a real year, month and day. Never a timestamp."
        canonical:
          type: string
          const: YYYY-MM-DD
          description: The spelling the value is stored in.
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDateSpelling"
          description: Spellings accepted on input.
        views:
          $ref: "#/components/schemas/CalendarDateViewSpellings"
          description: Per-view output spelling; views not named here use `canonical`.
      required:
        - type
        - canonical
        - accepts
      description: "A value that is a calendar date: a real year, month and day."
    CalendarDateViewSpellings:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/CalendarDateSpelling"
      description: Output spelling per view name. A view not named here writes the canonical spelling.
    CategoryEachAffixMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/EachAffix"
      description: What is written around every single value of a category, keyed by category id.
    CategoryLeadingSeparatorMap:
      type: object
      additionalProperties:
        type: string
      description: What is written immediately before a category, keyed by category id.
    CategoryPositionOverrides:
      type: object
      additionalProperties:
        type: number
      description: Concept positions used by one category when position sorting is selected.
    CategorySeparatorMap:
      type: object
      additionalProperties:
        type: string
      description: What is written between two values of one category, keyed by category id.
    CategoryTierMap:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/TierComposition"
      description: How a category's tiered concepts compose, keyed by category id.
    CategoryView:
      type: object
      properties:
        id:
          type: string
          description: Unique category identifier.
        label:
          type: string
          description: Resolved human-readable label (always a plain string).
        required:
          type: boolean
          description: Whether at least one concept is required for a valid marking.
        single:
          type: boolean
          description: Whether only one concept can be selected in this category.
        rollup:
          $ref: "#/components/schemas/Rollup"
          description: Rollup operator used when aggregating multiple markings.
        sort:
          anyOf:
            - $ref: "#/components/schemas/SortType"
            - type: array
              items:
                $ref: "#/components/schemas/SortType"
          description: Sort order for concepts within this category.
        positionOverrides:
          $ref: "#/components/schemas/CategoryPositionOverrides"
          description: Concept positions used only by this category's position sort.
        scopes:
          type: array
          items:
            type: string
          description: Scope IDs this category is visible in.
        position:
          type: number
          description: Declared rendering position (lower = earlier). Not resolved from array order.
        hierarchyRoot:
          type: boolean
          description: >-
            When true, the category grades its concepts by severity `rank`, and a coverage comparison counts a
            whole-marking concept here as covering a part's concept of equal or lower rank. It does not change
            rendering.
        defaultConcept:
          anyOf:
            - type: string
            - $ref: "#/components/schemas/ConditionalDefaultConcept"
          description: >-
            Concept ID to assert automatically when no selection exists in this category. With `single: true`, this
            provides a default level. Mirrors the scheme's `default_concept` for the category.
      required:
        - id
        - label
        - rollup
      description: >-
        Resolved view of a scheme category, suitable for display and selection UIs.


        Returned by `SchemeEngineAdapter.listCategories()`. Field names mirror the YAML `CategoryDoc` shape so consumers
        reading the source YAML and calling the API see identical names.
    CategoryViewMap:
      type: object
      additionalProperties:
        type: string
      description: The concept view a category is written in, keyed by category id.
    Change:
      type: object
      properties:
        ruleId:
          type: string
          description: >-
            Rule that made this change: a scheme rule's id, or an id the engine keeps for a change no scheme rule names.


            `_recognition_role` is one of them: the text was read as a view of one role, for a request whose context
            names the other. See `ValidateResult.inputWasValid`, and `ValidateResult.appliedFixes` for how it is shown.
        action:
          $ref: "#/components/schemas/FixAction"
          description: >-
            'add' (only `add` set), 'remove' (only `remove` set), 'replace' (both), 'reorder' (neither: the input parsed
            via a tolerant rule; the canonical form is in the result's `rendered`).
        add:
          type: array
          items:
            $ref: "#/components/schemas/FixConceptReference"
          description: Concepts the change added. Set for `add` and `replace`.
        remove:
          type: array
          items:
            $ref: "#/components/schemas/FixConceptReference"
          description: Concepts the change removed. Set for `remove` and `replace`.
        triggerConceptIds:
          type: array
          items:
            type: string
          description: Concept IDs whose presence triggered the rule that made this change.
        message:
          type: string
          description: What the change did, in words.
      required:
        - ruleId
        - action
        - message
      description: >-
        A change the engine actually made while processing. Lives in `appliedFixes`; a declined addition is not a
        change.
    CharacterWindow:
      type: object
      properties:
        chars:
          type: integer
          description: >-
            The largest distance allowed between two spans, counted in characters (UTF-16 code units) between their
            nearest edges. Spans that touch or overlap are 0 apart.
          minimum: 0
      required:
        - chars
      description: Proximity measured in raw characters.
    CheckCoverageResult:
      type: object
      properties:
        covered:
          type: boolean
          description: >-
            Whether the parent covers the children. True when `missing` and `excess` are both empty and no rollup was
            refused. False otherwise; `missing`, `excess` and `refusals` together say why.
        missing:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            Concepts the children need that the parent does not carry, judged per category as described on this type. In
            a `pipeline` category whose findings are not narrowed, this can include a value the pipeline itself adds
            when it rolls the parent up with the children. Empty when the parent lacks nothing.
        missingLabels:
          type: array
          items:
            type: string
          description: >-
            Display labels for the concepts in `missing`, for showing to a person. A label appears once even when
            several concepts display the same way, so the list can be shorter than `missing` and is not aligned with it
            by position. Where the operation takes an output format, labels are spelled in it. Empty when `missing` is
            empty.
        excess:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
          description: >-
            Concepts the parent carries that the children do not account for, judged per category as described on this
            type. In a `symmetric_difference`, `exclusive_or` or `complement` category that means values the parent
            states beyond the set the children roll up to. In a `pipeline` category whose findings are not narrowed it
            means every parent value the rollup of parent and children drops, which can include values the children
            carry. Everywhere else it means values the children do not allow.


            Concepts appear as the author wrote them. When a written value brought others with it, such as a group that
            stands for its members, only the written value is listed, not the members. In a category where nothing in
            excess was written by the author, every excess value is listed. `excess` is empty only when the parent
            carries nothing the children do not account for.
        excessLabels:
          type: array
          items:
            type: string
          description: >-
            Display labels for the concepts in `excess`, for showing to a person. A label appears once even when several
            concepts display the same way, so the list can be shorter than `excess` and is not aligned with it by
            position. Where the operation takes an output format, labels are spelled in it. Empty when `excess` is
            empty.
        rendered:
          type: string
          description: >-
            The children's aggregate, written in the requested format, so a UI can show the computed rollup without a
            separate aggregate call. Empty when there are no child markings.
        refusals:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
          description: >-
            What the scheme said when it refused a rollup this check computed, in the scheme's own words: the children
            rolled up together, or the parent rolled up with them.


            Markings that are each valid can still combine into a state the scheme does not allow, and that is a defect
            in the document rather than in the request: it is the answer a coverage check exists to give, so it is
            reported here instead of raised. Absent when no rollup was refused. Missing and excess concepts are never
            reported here; they have their own fields.


            Each entry names the constraint and carries the message the rule wrote, which is where the contributing
            markings are named.
      required:
        - covered
        - missing
        - missingLabels
        - excess
        - excessLabels
        - rendered
      description: >-
        Result of a coverage check. The engine is given a list of child markings and a single parent marking, aggregates
        the children in the scheme's format, then compares the parent with the children category by category.


        A parent can fail to cover its children in two ways, and each has its own field. `missing` is what the children
        need that the parent does not carry. `excess` is what the parent carries that the children do not account for. A
        caller tells "add this" from "remove this" by which field a concept is in, not by reading error text.


        How a category is judged comes from how the scheme rolls it up. A category that a rollup pipeline names is
        judged as a `pipeline` category, whatever rollup it declares. Every other category is judged by the rollup it
        declares.


        In a `union` category the parent must carry every value the children roll up to, and anything it lacks is
        missing. A value no child carries is allowed on the parent and is not excess.


        In an `intersection` category the parent may carry only values every child allows, and anything else it carries
        is excess. A shorter list, or none, is allowed and is not missing.


        In a `max`, `min` or `least_upper_bound` category the children roll up to one value, ordered by rank (`max`,
        `min`) or by the concept hierarchy (`least_upper_bound`). The parent must sit at or above that value for `max`
        and `least_upper_bound`, and at or below it for `min`. A parent anywhere else, including one the hierarchy does
        not order against that value, is reported once, under `missing`, and never under `excess`. The value reported is
        what the parent and children roll up to together. For `max` and `min` that is the children's own value. For
        `least_upper_bound` it is the bound the parent and children share, which can sit beyond the children's value,
        and it is the children's own value when the hierarchy gives them no common bound.


        In a `pipeline` category the parent covers when rolling it up with the children leaves it unchanged. This relies
        on the pipeline leaving a parent rolled up on its own unchanged, which the scheme author has to make true.


        The findings in `pipeline` categories are worked out for all the categories one pipeline names together. First
        they are narrowed to what the children roll up to on their own: a value the rollup of parent and children adds
        is missing only when the children's own rollup carries it, and a parent value that rollup drops is excess only
        when the children's own rollup does not carry it. The narrowed findings are then tested by acting on every
        finding of the report: the excess is taken out of the parent and the missing is put in, replacing what a
        single-value category held. They are reported only when that gives a parent that is valid under the scheme's
        rules and covers the children in every category, judged against the children's rollup. Otherwise, and whenever
        narrowing would leave nothing, the findings are not narrowed: every value the rollup of parent and children adds
        is missing, and every parent value it drops is excess, including one the children carry. Pipelines are decided
        one at a time, in the order the scheme lists them. Each is judged with the findings already decided for the
        pipelines before it and the full findings for those after it.


        In a `first` or `last` category the children roll up to one value and the rollup has no restrictive direction,
        so the parent must state that value. A parent that states a different one is reported once, under `missing`, as
        the value it should state, and never under `excess`. In such a category that holds several values, values the
        parent states beyond the picked one are not reported.


        In a `symmetric_difference`, `exclusive_or` or `complement` category the children roll up to a set and the
        rollup has no restrictive direction, so the parent must state exactly that set. Rolled-up values the parent does
        not state are missing. Values the parent states beyond that set are excess: stated, but not what the children
        roll up to. Neither side is more restrictive than the other here.


        In a category where the scheme has an `expand_group` rule, a parent that carries every member a group declares
        in that category states the group, and the group is not missing from it. This does not apply to a category whose
        rollup has no restrictive direction (`first`, `last`, `symmetric_difference`, `exclusive_or`, `complement`),
        where the parent must state what the children roll up to as it is.


        In a `union` or `pipeline` category the scheme marks as a hierarchy root, a parent value ranked at or above a
        needed value also covers it.


        With no non-empty children, a valid parent is covered and both lists are empty.


        `rendered` is the aggregate of the children rendered in the requested format; the UI can display it directly as
        the computed rollup without a separate aggregate() round-trip.
