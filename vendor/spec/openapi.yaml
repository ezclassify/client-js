          description: Source assertions explicitly covered by the candidate.
        reason:
          type: string
          description: Human-readable basis for the prohibition.
        authority:
          type: string
          description: Authority copied from the candidate, when declared.
        guidance:
          type: string
          description: Operator guidance copied from the candidate, when declared.
        citation:
          type: string
          description: Supporting citation copied from the candidate, when declared.
      required:
        - kind
        - selectionId
        - candidateId
        - sources
        - reason
      description: A selected cross-field candidate that prohibited a crosswalk translation.
