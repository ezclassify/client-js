            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtxSchemeProcessRequestBody"
            example:
              input: EXAMPLE-HIGH
      responses:
        "200":
          description: Processing result
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSchemeProcessResult"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            Invalid or missing request fields; an `inputFormat`, an `outputFormat`, an `outputs` address or a
            `suggestFor` category the scheme does not declare; or `parts` holds more entries than this deployment
            allows. The deployment sets that cap, so the schema states no maximum.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/ctx/{ctxId}/{version}/scheme/validate:
    post:
      operationId: ctxSchemeValidate
      summary: Validate a marking in a context
      description: >-
        The reader's call. Judges a marking, given as text or as the facts it states, against the context's composed
        scheme (base + layers). The marking is settled exactly as process settles it, so `valid` and `inputWasValid`
        mean what they mean on every route. `surface`, `context` and `parts` say what the marking is judged as, as they
        do on process. Returns the settled facts, the verdicts, errors and warnings, the changes settling made, the
        marking written back with what that writing left out, how recognition read it, the notices it requires, and its
        display color. Fix paths and corrections to the text belong to process. The :version segment may be omitted to
        default to "latest"; the resolved version is returned in the X-EzClassify-Resolved-Version response header.
      tags:
        - context
        - scheme
      parameters:
        - name: ctxId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: >-
            A concrete semver version, or `latest`. The version served is reported in the X-EzClassify-Resolved-Version
            response header. The segment may also be left out of the URL, which the server reads as `latest`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtxSchemeValidateRequestBody"
            example:
              input: EXAMPLE-HIGH
      responses:
        "200":
          description: Validation result
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSchemeValidateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
