        composed scheme (base + layers), settles it, and returns everything validate returns plus what an author needs:
        the corrections to the text, proven fix paths, the outputs named in `outputs` and, when `suggestFor` names
        categories, the picker options for them. The :version segment may be omitted to default to "latest"; the
        resolved version is returned in the X-EzClassify-Resolved-Version response header.
