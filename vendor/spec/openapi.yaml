              $ref: "#/components/schemas/CtxCrosswalkTranslateRequestBody"
            example:
              crosswalkId: state-to-district
              marking: LEVEL-HIGH
      responses:
        "200":
          description: Resolved Context crosswalk translation
          headers:
            X-EzClassify-Resolved-Version:
              $ref: "#/components/headers/ResolvedVersion"
          content:
            application/json:
              schema:
